}

// Etiqueta de tipo de maquinaria/material segun el rubro
function balGenTipoLabel(rubKey, r) {
  const t = r.tipo || '';
  if (rubKey === 'viajes') {
    if (t === 'extra' && (r.tipoOtro||'').trim()) return r.tipoOtro.trim();
    return VIAJE_TIPO_LABELS[t] || t || 'Sin tipo';
  }
  if (rubKey === 'pesada') {
    if (t === 'otro' && (r.tipoOtro||'').trim()) return r.tipoOtro.trim();
    return RETRO_LABELS[t] || t || 'Sin tipo';
  }
  if (rubKey === 'ligera') return MAQL_LABELS[t] || t || 'Sin tipo';
  return t || 'Sin tipo';
}
// Unidad de medida / tipo de renta segun el rubro
function balGenUnidadLabel(rubKey, r) {
  if (rubKey === 'viajes') return (r.columna || '').trim();
  if (rubKey === 'pesada') {
    if (r.renta === 'extra' && (r.rentaExtra||'').trim()) return r.rentaExtra.trim();
    return RENTA_LABELS[r.renta] || r.renta || '';
  }
  if (rubKey === 'ligera') {
    if (r.renta === 'extra' && (r.rentaExtra||'').trim()) return r.rentaExtra.trim();
    return MAQL_RENTA_LABELS[r.renta] || r.renta || '';
  }
  return '';
}
function balGenDetalleTxt(dt) {
  const u = Array.from(dt.unidades).filter(Boolean).join(' / ');
  const parts = [];
  if (dt.cantidad > 0) parts.push(u ? `${dt.cantidad} ${u}` : `Cant. ${dt.cantidad}`);
  else if (u) parts.push(u);
  if (dt.tiempoExtra > 0) parts.push(`+${dt.tiempoExtra} hrs extra`);
  return parts.join(' · ');
}
function balGenDetalleOrdenado(cli, rubKey) {
  return Object.values((cli.porDetalle && cli.porDetalle[rubKey]) || {})
    .sort((a,b) => (a.obra||'\uffff').localeCompare(b.obra||'\uffff') || a.tipo.localeCompare(b.tipo));
}

// Lista de obras (de los 3 rubros) para el selector; se normaliza para que "Torre A" y "torre a " cuenten como una sola
function balGenListaObras() {
  const mapa = {}; let haySinObra = false;
  BALGEN_RUBROS.forEach(rub => rub.get().forEach(r => {
    if (!(r.cliente || '').trim()) return;
    const o = (r.obra || '').trim();
    if (!o) { haySinObra = true; return; }
    const k = o.toLowerCase();
    if (!mapa[k]) mapa[k] = o;
  }));
  const lista = Object.entries(mapa).map(([k, label]) => ({ k, label })).sort((a,b) => a.label.localeCompare(b.label));
  return { lista, haySinObra };
}
function balGenActualizarSelectorObras() {
  const sel = document.getElementById('balGenObraSelect');
  if (!sel) return;
  const { lista, haySinObra } = balGenListaObras();
  const esc = (t) => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  let html = '<option value="">Todas las obras</option>';
  lista.forEach(o => { html += `<option value="${esc(o.k)}">${esc(o.label)}</option>`; });
  if (haySinObra) html += '<option value="__sin__">Sin obra</option>';
  sel.innerHTML = html;
  const existe = balGenObra === '' || (balGenObra === '__sin__' && haySinObra) || lista.some(o => o.k === balGenObra);
  if (!existe) balGenObra = '';
  sel.value = balGenObra;
}
function balGenObraTxt() {
  if (!balGenObra) return '';
  if (balGenObra === '__sin__') return 'Sin obra';
  const o = balGenListaObras().lista.find(x => x.k === balGenObra);
  return o ? o.label : balGenObra;
}

function balGenAgrupar() {
  const enRango = (r) => {
    if (balGenDesde && r.fecha < balGenDesde) return false;
    if (balGenHasta && r.fecha > balGenHasta) return false;
    if (balGenObra) {
      const o = (r.obra || '').trim().toLowerCase();
      if (balGenObra === '__sin__' ? o !== '' : o !== balGenObra) return false;
    }
    return true;
  };
  const grupos = {};
  BALGEN_RUBROS.forEach(rub => {
    rub.get().filter(enRango).forEach(r => {
      const key = (r.cliente || '').trim();
      if (!key) return;
      const rTieneFinal = (parseFloat(r.montoFinal) || 0) > 0;
      const obra = (r.obra || '').trim();
      const gkey = key.toLowerCase();
      if (!grupos[gkey]) grupos[gkey] = { nombre: key, obras: new Set(), porRubro: {}, porDetalle: {}, porMaterial: {}, porAccesorio: {}, registrosSinFinal: 0 };
      if (obra) grupos[gkey].obras.add(obra);
      const rMontoFinalConIva = montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal);
      const rIvaMonto = r.iva ? (parseFloat(r.monto) || 0) * IVA_RATE_VIAJES : 0;
      const rIvaFinalMonto = r.ivaFinal ? (parseFloat(r.montoFinal) || 0) * IVA_RATE_VIAJES : 0;
      if (!grupos[gkey].porRubro[rub.key]) grupos[gkey].porRubro[rub.key] = { registros: 0, monto: 0, montoFinal: 0, iva: 0, ivaFinal: 0, registrosConIva: 0, registrosConIvaFinal: 0, registrosSinFinal: 0 };
      grupos[gkey].porRubro[rub.key].registros++;
      grupos[gkey].porRubro[rub.key].monto += r.monto || 0;
      grupos[gkey].porRubro[rub.key].montoFinal += rMontoFinalConIva;
      if (!rTieneFinal) { grupos[gkey].porRubro[rub.key].registrosSinFinal++; grupos[gkey].registrosSinFinal++; }
      if (r.iva) grupos[gkey].porRubro[rub.key].registrosConIva++;
      if (r.ivaFinal) grupos[gkey].porRubro[rub.key].registrosConIvaFinal++;
      grupos[gkey].porRubro[rub.key].iva += rIvaMonto;
      grupos[gkey].porRubro[rub.key].ivaFinal += rIvaFinalMonto;

      // Desglose fino: obra + tipo de maquinaria/material dentro de cada rubro
      const dTipo = balGenTipoLabel(rub.key, r);
      const dkey = obra.toLowerCase() + '||' + dTipo.toLowerCase();
      if (!grupos[gkey].porDetalle[rub.key]) grupos[gkey].porDetalle[rub.key] = {};
      const detMap = grupos[gkey].porDetalle[rub.key];
      if (!detMap[dkey]) detMap[dkey] = { obra: obra, tipo: dTipo, registros: 0, cantidad: 0, tiempoExtra: 0, unidades: new Set(), monto: 0, montoFinal: 0, iva: 0, registrosSinFinal: 0, registrosConIva: 0 };
      const dd = detMap[dkey];
      dd.registros++;
      dd.cantidad += parseFloat(r.cantidad) || 0;
      dd.tiempoExtra += parseFloat(r.tiempoExtra) || 0;
      const uni = balGenUnidadLabel(rub.key, r);
      if (uni) dd.unidades.add(uni);
      dd.monto += r.monto || 0;
      dd.montoFinal += rMontoFinalConIva;
      dd.iva += rIvaMonto;
      if (!rTieneFinal) dd.registrosSinFinal++;
      if (r.iva) dd.registrosConIva++;

      if (rub.key === 'viajes') {
        const ivaMonto = rIvaMonto;
        const tipo = r.tipo || 'otro';
        if (!grupos[gkey].porMaterial[tipo]) grupos[gkey].porMaterial[tipo] = { viajes: 0, cantidad: 0, monto: 0, montoFinal: 0, iva: 0, detalle: [] };
        grupos[gkey].porMaterial[tipo].viajes++;
        grupos[gkey].porMaterial[tipo].cantidad += r.cantidad || 0;
        grupos[gkey].porMaterial[tipo].monto += r.monto || 0;
        grupos[gkey].porMaterial[tipo].montoFinal += rMontoFinalConIva;
        grupos[gkey].porMaterial[tipo].iva += ivaMonto;
        grupos[gkey].porMaterial[tipo].detalle.push({ fecha: r.fecha || '', obra: obra, cantidad: parseFloat(r.cantidad) || 0, monto: r.monto || 0, montoFinal: rMontoFinalConIva, iva: ivaMonto, tieneFinal: rTieneFinal });
      }
      if (rub.key === 'pesada') {
        const acc = r.accesorioTipo || '';
        if (!grupos[gkey].porAccesorio[acc]) grupos[gkey].porAccesorio[acc] = { regs: 0, tiempoExtra: 0, detalle: [] };
        grupos[gkey].porAccesorio[acc].regs++;
        grupos[gkey].porAccesorio[acc].tiempoExtra += r.tiempoExtra || 0;
        grupos[gkey].porAccesorio[acc].detalle.push({ fecha: r.fecha || '', obra: obra, chofer: r.chofer || '', tiempoExtra: parseFloat(r.tiempoExtra) || 0 });
      }
    });
  });
  Object.values(grupos).forEach(g => { g.obra = Array.from(g.obras).join(', '); });
  return grupos;
}

function renderBalanceGeneralCliente() {
  const content = document.getElementById('balGenContent');
  const countEl = document.getElementById('balGenCount');
  if (!content) return;

  balGenActualizarSelectorObras();
  const grupos = balGenAgrupar();
  const clientes = Object.values(grupos).sort((a,b)=> a.nombre.localeCompare(b.nombre) || a.obra.localeCompare(b.obra));
  const clientesUnicos = new Set(clientes.map(c=>c.nombre.toLowerCase())).size;
  const rangoTxt = ((balGenDesde || balGenHasta) ? ` · ${balGenDesde||'inicio'} a ${balGenHasta||'hoy'}` : '') + (balGenObra ? ` · Obra: ${balGenObraTxt()}` : '');
  if (countEl) countEl.textContent = `· ${clientesUnicos} cliente${clientesUnicos!==1?'s':''} · ${clientes.length} obra${clientes.length!==1?'s':''}${rangoTxt}`;

  if (clientes.length === 0) {
    content.innerHTML = `<div class="no-clientes"><div style="font-size:32px;margin-bottom:10px">👤</div><div>No hay clientes registrados con esos filtros (fechas / obra).</div></div>`;
    return;
  }

  const COLORES = ['#16a34a','#2563eb','#7c3aed','#d97706','#dc2626','#0891b2','#db2777','#64748b'];

  content.innerHTML = clientes.map((cli, ci) => {
    const color = COLORES[ci % COLORES.length];
    let totalInicial = 0, totalFinal = 0, totalRegistros = 0, totalIvaGen = 0;
    const pendienteBadge = (n) => `<span style="display:inline-block;font-size:10.5px;font-weight:700;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:20px;padding:2px 9px;">Pendiente${n?` (${n} sin llenar)`:''}</span>`;

    const filas = BALGEN_RUBROS.map(rub => {
      const d = cli.porRubro[rub.key];
      if (!d) return '';
      totalInicial += d.monto;
      totalFinal += d.montoFinal;
      totalRegistros += d.registros;
      totalIvaGen += d.iva || 0;
      const bal = d.montoFinal - d.monto;
      const esViajesConIva = d.iva > 0;
      const pendiente = d.registrosSinFinal > 0;
      const subFilas = balGenDetalleOrdenado(cli, rub.key).map(dt => {
        const dPend = dt.registrosSinFinal > 0;
        const dBal = dt.montoFinal - dt.monto;
        const detTxt = balGenDetalleTxt(dt);
        return `<tr style="background:var(--gray-50)">
          <td style="padding-left:18px;font-size:11.5px;color:var(--gray-500)">↳</td>
          <td style="font-size:11.5px;color:var(--gray-900);font-weight:500">${dt.obra ? dt.obra : sinObraTxt}</td>
          <td style="font-size:11.5px;color:var(--gray-500)">${dt.tipo}${detTxt ? ` <span style="color:var(--gray-400)">· ${detTxt}</span>` : ''}</td>
          <td style="text-align:right;font-size:11.5px">${dt.registros}</td>
          <td style="text-align:right;font-size:11.5px;color:#dc2626">${dt.monto>0?fmt(dt.monto):'—'}</td>
          ${hayIvaGen ? `<td style="text-align:right;font-size:11.5px;color:#d97706">${dt.iva>0?fmt(dt.iva):'—'}</td>` : ''}
          <td style="text-align:right;font-size:11.5px;color:#16a34a">${dPend ? pendienteBadge(dt.registrosSinFinal) : (dt.montoFinal>0?fmt(dt.montoFinal):'—')}</td>
          <td style="text-align:right;font-size:11.5px;color:${dBal>=0?'#16a34a':'#dc2626'}">${dPend ? '—' : fmt(dBal)}</td>
        </tr>`;
      }).join('');
      return `<tr>
        <td><span style="background:${rub.color}22;color:${rub.color};padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;">${rub.icon} ${rub.label}</span></td>
        <td colspan="2" style="font-size:10.5px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.3px">Total del rubro</td>
        <td style="text-align:right">${d.registros}</td>
        <td style="text-align:right;color:#dc2626">${d.monto>0?fmt(d.monto):'—'}</td>
        ${hayIvaGen ? `<td style="text-align:right;color:#d97706">${d.iva>0?fmt(d.iva):'—'}</td>` : ''}
        <td style="text-align:right;color:#16a34a">${pendiente ? pendienteBadge(d.registrosSinFinal) : (d.montoFinal>0?fmt(d.montoFinal):'—')}${(!pendiente && esViajesConIva) ? ' <span style="display:inline-block;font-size:9px;font-weight:700;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:1px 6px;margin-left:5px;vertical-align:middle;">Total c/IVA</span>' : ''}</td>

    const rubrosPresentes = BALGEN_RUBROS.filter(r => cli.porRubro[r.key]).length;

          <td style="text-align:right;font-size:11.5px">${dt.tiempoExtra>0?dt.tiempoExtra+' hrs':'—'}</td>
        </tr>`).join('');
      return `<tr style="font-weight:600">
        <td><span style="background:${ac.bg};color:${ac.text};padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;">${RETRO_ACCESORIO_LABELS[t]}</span></td>
        <td style="font-size:10.5px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.3px" colspan="2">${d.regs} registro${d.regs!==1?'s':''}</td>

          ${hayPendientes ? '' : `<div style="font-size:12px;color:${margen>=0?'#16a34a':'#dc2626'};font-weight:600;background:${margen>=0?'#dcfce7':'#fee2e2'};padding:4px 12px;border-radius:20px;">Margen ${margen}%</div>`}
          <button class="btn-print-cliente" onclick="imprimirBalanceGeneralCliente('${cli.nombre.replace(/'/g,"\\'")}','${cli.obra.replace(/'/g,"\\'")}')">

        <div class="cli-metric"><div class="cli-metric-label">Monto Final (Ingreso)</div><div class="cli-metric-val" style="color:#16a34a">${hayPendientes ? pendienteBadge(cli.registrosSinFinal) : (totalFinal>0?fmt(totalFinal):'—')}</div></div>
        ${hayPendientes ? '' : `<div class="cli-metric"><div class="cli-metric-label">Balance Total (3 rubros)</div><div class="cli-metric-val" style="color:${balanceTotal>=0?'#16a34a':'#dc2626'}">${fmt(balanceTotal)}</div></div>`}

function imprimirBalanceGeneralCliente(nombreCliente, obraCliente) {
  obraCliente = obraCliente || '';
  const gkey = nombreCliente.trim().toLowerCase();
  const grupos = balGenAgrupar();
  const cli = grupos[gkey];
  if (!cli) { alert('No hay registros para este cliente.'); return; }

  let totalInicial = 0, totalFinal = 0, totalRegistros = 0;
  // En el reporte que ve el CLIENTE no se muestra la etiqueta "Pendiente (N sin llenar)":
  // cuando el Monto Final de un rubro no esta capturado, la celda queda simplemente vacia ("—").
  const pendienteBadgeP = () => `<span style="color:#94a3b8">—</span>`;
  let totalIvaFilas = 0;
  const hayIvaGenP = BALGEN_RUBROS.some(rb => ((cli.porRubro[rb.key]||{}).iva||0) > 0);
  const tdP = 'padding:8px 10px;border-bottom:1px solid #f1f5f9';
  const tdS = 'padding:5px 10px 5px 22px;border-bottom:1px solid #f8fafc;font-size:11.5px;background:#fcfdfe';
  const filasRubro = BALGEN_RUBROS.map(rub => {
    const d = cli.porRubro[rub.key];
    if (!d) return '';
    totalInicial += d.monto;
    totalFinal += d.montoFinal;
    totalRegistros += d.registros;
    totalIvaFilas += d.iva || 0;
    const bal = d.montoFinal - d.monto;
    const esViajesConIva = d.iva > 0;
    const pendiente = d.registrosSinFinal > 0;
    const subFilas = balGenDetalleOrdenado(cli, rub.key).map(dt => {
      const dPend = dt.registrosSinFinal > 0;
      const dBal = dt.montoFinal - dt.monto;
      const detTxt = balGenDetalleTxt(dt);
      return `<tr>
        <td style="${tdS};color:#94a3b8">↳</td>
        <td style="${tdS};color:#0f172a;font-weight:500">${dt.obra || '<span style="color:#94a3b8;font-style:italic">Sin obra</span>'}</td>
        <td style="${tdS};color:#64748b">${dt.tipo}${detTxt ? ` <span style="color:#94a3b8">· ${detTxt}</span>` : ''}</td>
        <td style="${tdS};text-align:right">${dt.registros}</td>
        <td style="${tdS};text-align:right;color:#dc2626">${dt.monto>0?fmt(dt.monto):'—'}</td>
        ${hayIvaGenP ? `<td style="${tdS};text-align:right;color:#d97706">${dt.iva>0?fmt(dt.iva):'—'}</td>` : ''}
        <td style="${tdS};text-align:right;color:#16a34a">${dPend ? pendienteBadgeP(dt.registrosSinFinal) : (dt.montoFinal>0?fmt(dt.montoFinal):'—')}</td>
      </tr>`;
    }).join('');
    return `<tr>
      <td style="${tdP};font-weight:600">${rub.icon} ${rub.label}</td>
      <td colspan="2" style="${tdP};font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px">Total del rubro</td>
      <td style="${tdP};text-align:right">${d.registros}</td>
      <td style="${tdP};text-align:right;color:#dc2626">${d.monto>0?fmt(d.monto):'—'}</td>
      ${hayIvaGenP ? `<td style="${tdP};text-align:right;color:#d97706">${d.iva>0?fmt(d.iva):'—'}</td>` : ''}
      <td style="${tdP};text-align:right;color:#16a34a;font-weight:600">${pendiente ? pendienteBadgeP(d.registrosSinFinal) : (d.montoFinal>0?fmt(d.montoFinal):'—')}${(!pendiente && esViajesConIva) ? ' <span style="display:inline-block;font-size:9px;font-weight:700;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:1px 6px;margin-left:5px;vertical-align:middle;">Total c/IVA</span>' : ''}</td>
    </tr>${subFilas}`;
  }).join('');
  const hayPendientesP = cli.registrosSinFinal > 0;

  const ivaTotalViajes = (cli.porRubro.viajes && cli.porRubro.viajes.iva) || 0;
  const ivaTotalGeneral = BALGEN_RUBROS.reduce((a,rb) => a + ((cli.porRubro[rb.key] && cli.porRubro[rb.key].iva) || 0), 0);
  const regsConIvaGeneral = BALGEN_RUBROS.reduce((a,rb) => a + ((cli.porRubro[rb.key] && cli.porRubro[rb.key].registrosConIva) || 0), 0);
  const tieneIvaGeneral = ivaTotalGeneral > 0;
  const tieneIva = ivaTotalViajes > 0;
  const viajesMontoFinal = (cli.porRubro.viajes && cli.porRubro.viajes.montoFinal) || 0;
  const mostrarCantidadConIva = tieneIva && viajesMontoFinal > 0;

  // Segundo reporte (Monto Final): solo se genera cuando Viajes, Maq. Pesada y Maq. Ligera
  // tienen el Monto Final capturado en TODOS sus registros (sin pendientes) y hay algo que reportar.
  // Si falta algún Monto Final por llenar, no se genera y el reporte se imprime tal como ya estaba.
  const ivaFinalTotalGeneral = BALGEN_RUBROS.reduce((a,rb) => a + ((cli.porRubro[rb.key] && cli.porRubro[rb.key].ivaFinal) || 0), 0);
  const regsConIvaFinal = BALGEN_RUBROS.reduce((a,rb) => a + ((cli.porRubro[rb.key] && cli.porRubro[rb.key].registrosConIvaFinal) || 0), 0);
  const subtotalFinalGeneral = totalFinal - ivaFinalTotalGeneral;
  const tieneIvaFinalGeneral = ivaFinalTotalGeneral > 0;
  const mostrarSegundoReporte = !hayPendientesP && totalFinal > 0;

  const fmtFechaCorta = (f) => f ? new Date(f+'T00:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
  const sinObraTxtP = '<span style="color:#94a3b8;font-style:italic">Sin obra</span>';
  const tdSubP = 'padding:5px 10px 5px 22px;border-bottom:1px solid #f8fafc;font-size:11px;background:#fcfdfe';

  const materialRows = Object.entries(cli.porMaterial).map(([tipo,d]) => {
    const detalleOrdenado = [...d.detalle].sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
    const subFilas = detalleOrdenado.map(dt => `
      <tr>
        <td style="${tdSubP}">↳ ${fmtFechaCorta(dt.fecha)}</td>
        <td style="${tdSubP}">${dt.obra || sinObraTxtP}</td>
        <td style="${tdSubP};text-align:right">${dt.cantidad>0?dt.cantidad:'—'}</td>
        <td style="${tdSubP};text-align:right;color:#dc2626">${dt.monto>0?fmt(dt.monto):'—'}</td>
        <td style="${tdSubP};text-align:right;color:#16a34a">${dt.tieneFinal?fmt(dt.montoFinal):'—'}</td>
        ${tieneIva ? `<td style="${tdSubP};text-align:right;color:#d97706">${dt.iva>0?fmt(dt.iva):'—'}</td>` : ''}
      </tr>`).join('');
    return `<tr>
      <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;font-weight:600">${VIAJE_TIPO_LABELS[tipo]||tipo}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px">${d.viajes} viaje${d.viajes!==1?'s':''}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right">${d.cantidad>0?d.cantidad:'—'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right;color:#dc2626">${d.monto>0?fmt(d.monto):'—'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right;color:#16a34a;font-weight:600">${d.montoFinal>0?fmt(d.montoFinal):'—'}</td>
      ${tieneIva ? `<td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right;color:#d97706">${d.iva>0?fmt(d.iva):'—'}</td>` : ''}
    </tr>${subFilas}`;
  }).join('');

  const accesorioRows = RETRO_ACCESORIO_TIPOS.filter(t => cli.porAccesorio[t]).map(t => {
    const d = cli.porAccesorio[t];
    const detalleOrdenado = [...d.detalle].sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
    const subFilas = detalleOrdenado.map(dt => `
      <tr>
        <td style="${tdSubP}">↳ ${fmtFechaCorta(dt.fecha)}</td>
        <td style="${tdSubP}">${dt.obra || sinObraTxtP}</td>
        <td style="${tdSubP}">${dt.chofer || sinObraTxtP}</td>
        <td style="${tdSubP};text-align:right">${dt.tiempoExtra>0?dt.tiempoExtra+' hrs':'—'}</td>
      </tr>`).join('');
    return `<tr>
      <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;font-weight:600">${RETRO_ACCESORIO_LABELS[t]}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px" colspan="2">${d.regs} registro${d.regs!==1?'s':''}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right">${d.tiempoExtra>0?d.tiempoExtra+' hrs':'—'}</td>
    </tr>${subFilas}`;}).join('');

  const balanceTotal = totalFinal - totalInicial;
  const margen = totalFinal > 0 ? Math.round(balanceTotal/totalFinal*100) : 0;
  const hoy = new Date().toLocaleDateString('es-MX', { day:'2-digit', month:'long', year:'numeric' });
  const obraTxt = cli.obra ? cli.obra : 'Sin obra especificada';
  const periodoTxt = (balGenDesde || balGenHasta)
    ? `Periodo: ${balGenDesde ? fmtFechaCorta(balGenDesde) : 'inicio'} al ${balGenHasta ? fmtFechaCorta(balGenHasta) : 'hoy'}`
    : 'Periodo: Todos los registros (sin filtro de fecha)';
  const periodoTxtFull = periodoTxt + (balGenObra ? ` · Obra: ${balGenObraTxt()}` : '');

  const html = `<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><title>FLOSAN — Balance General — ${cli.nombre}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head><body>

  <div><div style="font-size:20px;font-weight:700">${cli.nombre}</div><div style="font-size:12px;color:#64748b">Obra: ${obraTxt} · ${totalRegistros} registro${totalRegistros!==1?'s':''}</div></div>

const DIESEL_EQUIPOS = ['retro_bobcat','rodillo','camion1','camion2','camion3','camion4'];
const DIESEL_LABELS = { retro_bobcat:'Retro Bobcat', rodillo:'Rodillo', camion1:'Camión 1', camion2:'Camión 2', camion3:'Camión 3', camion4:'Camión 4' };
const DIESEL_COLORS = {
  retro_bobcat:{bg:'#f3e8ff',text:'#7c3aed'}, rodillo:{bg:'#dbeafe',text:'#1d4ed8'},
  camion1:{bg:'#fef3c7',text:'#92400e'}, camion2:{bg:'#dcfce7',text:'#16a34a'},

// Devuelve la lista de equipos fijos + los equipos personalizados ("Otro...")
// que ya se hayan guardado en los registros, para que aparezcan en filtros,
// resumen y gráficas.
function dieselAllEquipoKeys() {
  const personalizados = [...new Set([
    ...dieselEqData.map(r => r.equipo),
    ...dieselJuanSalidas.map(r => r.equipo)
  ].filter(k => k && k !== 'otro' && !DIESEL_EQUIPOS.includes(k)))];
  return [...DIESEL_EQUIPOS, ...personalizados];
}
function dieselLabel(key) { return DIESEL_LABELS[key] || key || 'Otro'; }
function dieselColorOf(key) { return DIESEL_COLORS[key] || { bg: '#e2e8f0', text: '#475569' }; }

function recalcDieselEnGastos() {
  const modSubrenta = MODULES.find(m => m.id === 'pago_subrenta');
  if (!modSubrenta) return;
  let itemDiesel = modSubrenta.items.find(it => it.isDieselEquipo);
  if (!itemDiesel) return;
  const nuevos = new Array(12).fill(0);
  dieselEqData.forEach(r => {
    const mes = new Date(r.fecha + 'T12:00:00').getMonth();
    nuevos[mes] += parseFloat(r.costo) || 0;
  });
  itemDiesel.vals = nuevos;
  renderModuleTable(modSubrenta);
  refreshDashboard();
  guardarDatos();
}

const MES_ABR_ES = { ene:0, feb:1, mar:2, abr:3, may:4, jun:5, jul:6, ago:7, sep:8, oct:9, nov:10, dic:11 };
function mesIndexDeFechaCorta(str) {
  if (!str) return null;
  const partes = String(str).toLowerCase().split(' ');
  for (const p of partes) {
    const clave = p.replace('.', '').slice(0, 3);
    if (clave in MES_ABR_ES) return MES_ABR_ES[clave];
  }
  return null;
}

function recalcNominaEnGastos() {
  const modSubrenta = MODULES.find(m => m.id === 'pago_subrenta');
  if (!modSubrenta) return;
  let itemNomina = modSubrenta.items.find(it => it.isNominaNeto);
  if (!itemNomina) return;
  const nuevos = new Array(12).fill(0);
  nominaData.forEach(r => {
    let mes = (typeof r.mesIndex === 'number') ? r.mesIndex : mesIndexDeFechaCorta(r.fecha);
    if (mes === null || mes === undefined) mes = new Date().getMonth();
    nuevos[mes] += parseFloat(r.monto) || 0;
  });
  itemNomina.vals = nuevos;
  renderModuleTable(modSubrenta);
  refreshDashboard();
  guardarDatos();
}

// Refleja (solo lectura) los totales mensuales de Mantenimiento General,
// Construcción y Gastos Oficina dentro del módulo "Gastos Total",
// para que aparezcan sumados ahí sin duplicarse en el gran total (ver
// gastosTotales(), que excluye estos 3 espejos al sumar "pago_subrenta").
function recalcCategoriaEnGastosTotal(mid, flagName) {
  const modSubrenta = MODULES.find(m => m.id === 'pago_subrenta');
  if (!modSubrenta) return;
  const itemAuto = modSubrenta.items.find(it => it[flagName]);
  if (!itemAuto) return;
  const mod = MODULES.find(m => m.id === mid);
  const nuevos = new Array(12).fill(0);
  if (mod) MONTHS.forEach((_,mi) => { nuevos[mi] = totalRow(mod.items, mi); });
  itemAuto.vals = nuevos;
}
function recalcTodasCategoriasEnGastosTotal() {
  recalcCategoriaEnGastosTotal('mant_general', 'isMantGeneralAuto');
  recalcCategoriaEnGastosTotal('bodega', 'isBodegaAuto');
  recalcCategoriaEnGastosTotal('oficina', 'isOficinaAuto');
  const modSubrenta = MODULES.find(m => m.id === 'pago_subrenta');
  if (modSubrenta) renderModuleTable(modSubrenta);
  refreshDashboard();
  guardarDatos();
}

// ── Filtro por fecha de las tablas de Juan (por defecto: solo la semana actual) ──
let dieselFechaModo = 'semana';   // 'semana' | 'semana_pasada' | 'todo' | 'rango'
let dieselFechaDesde = '';
let dieselFechaHasta = '';

function _isoLocalDiesel(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
// Devuelve {desde, hasta} en YYYY-MM-DD, o null si se ve todo el historial
function getRangoFiltroFechaJuan() {
  if (dieselFechaModo === 'todo') return null;
  if (dieselFechaModo === 'rango') return { desde: dieselFechaDesde || '', hasta: dieselFechaHasta || '' };
  const { lunes, domingo } = getRangoSemanaActual();
  const l = new Date(lunes), d = new Date(domingo);
  if (dieselFechaModo === 'semana_pasada') { l.setDate(l.getDate()-7); d.setDate(d.getDate()-7); }
  return { desde: _isoLocalDiesel(l), hasta: _isoLocalDiesel(d) };
}
// Un registro sin fecha (recién agregado) siempre se muestra para que no se pierda
function fechaPasaFiltroJuan(f) {
  const r = getRangoFiltroFechaJuan();
  if (!r || !f) return true;
  if (r.desde && f < r.desde) return false;
  if (r.hasta && f > r.hasta) return false;
  return true;
}
function _fechaCortaDiesel(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('es-MX', { day:'numeric', month:'short' });
}
function cambiarFiltroFechaJuan() {
  const modo = document.getElementById('juanFiltroModo');
  if (modo) dieselFechaModo = modo.value;
  const d = document.getElementById('juanFechaDesde'), h = document.getElementById('juanFechaHasta');
  dieselFechaDesde = d ? d.value : '';
  dieselFechaHasta = h ? h.value : '';
  const box = document.getElementById('juanRangoCustom');
  if (box) box.style.display = dieselFechaModo === 'rango' ? 'flex' : 'none';
  renderJuanTablas();
}
function actualizarInfoFiltroJuan() {
  const el = document.getElementById('juanFiltroInfo');
  if (!el) return;
  const r = getRangoFiltroFechaJuan();
  if (!r) { el.textContent = 'Mostrando todo el historial'; return; }
  const ocultos = dieselJuanCargas.filter(x => !fechaPasaFiltroJuan(x.fecha)).length
                + dieselJuanSalidas.filter(x => !fechaPasaFiltroJuan(x.fecha)).length;
  let rango;
  if (r.desde && r.hasta) rango = `del ${_fechaCortaDiesel(r.desde)} al ${_fechaCortaDiesel(r.hasta)}`;
  else if (r.desde) rango = `desde el ${_fechaCortaDiesel(r.desde)}`;
  else if (r.hasta) rango = `hasta el ${_fechaCortaDiesel(r.hasta)}`;
  else rango = 'sin límite de fechas';
  el.innerHTML = `Mostrando ${rango}` + (ocultos ? ` · <strong>${ocultos}</strong> registro${ocultos!==1?'s':''} fuera de este periodo` : '');
}

// Devuelve el rango (lunes-domingo) de la semana actual.
function getRangoSemanaActual() {
  const hoy = new Date();
  const dia = hoy.getDay(); // 0=Dom,1=Lun,...6=Sáb
  const diffLunes = (dia === 0 ? -6 : 1 - dia);
  const lunes = new Date(hoy); lunes.setHours(0,0,0,0); lunes.setDate(hoy.getDate() + diffLunes);
  const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6); domingo.setHours(23,59,59,999);
  return { lunes, domingo };
}
function fechaEnRango(fechaStr, lunes, domingo) {
  if (!fechaStr) return false;
  const d = new Date(fechaStr + 'T12:00:00');
  return d >= lunes && d <= domingo;
}

function calcPorEquipoJuanSalidas(soloSemanaActual) {
  const porEquipo = {};
  dieselAllEquipoKeys().forEach(eq => porEquipo[eq] = { litros:0, regs:0 });
  let salidas = dieselJuanSalidas;
  if (soloSemanaActual) {
    const { lunes, domingo } = getRangoSemanaActual();
    salidas = salidas.filter(r => fechaEnRango(r.fecha, lunes, domingo));
  }
  salidas.forEach(r => {
    if (!porEquipo[r.equipo]) porEquipo[r.equipo] = { litros:0, regs:0 };
    porEquipo[r.equipo].litros += r.litros||0;
    porEquipo[r.equipo].regs++;
  });
  return porEquipo;
}

// Litros de Juan por semana (lun-dom):
//  - cargadoSemana  = suma de litros cargados esta semana (lo que muestra la gráfica "Litros por Día")
//  - sobranteAnterior = litros cargados − litros usados la semana anterior (mínimo 0)
//  - limiteTotal    = cargadoSemana + sobranteAnterior (lo que Juan tiene disponible esta semana)
function calcDieselJuanSemana() {
  const { lunes, domingo } = getRangoSemanaActual();
  const lunesPrev = new Date(lunes); lunesPrev.setDate(lunes.getDate() - 7);
  const domingoPrev = new Date(domingo); domingoPrev.setDate(domingo.getDate() - 7);
  const sumar = (arr, ini, fin) => arr.filter(r => fechaEnRango(r.fecha, ini, fin)).reduce((t, r) => t + (parseFloat(r.litros) || 0), 0);
  const cargadoSemana = sumar(dieselJuanCargas, lunes, domingo);
  const cargadoPrev = sumar(dieselJuanCargas, lunesPrev, domingoPrev);
  const usadoPrev = sumar(dieselJuanSalidas, lunesPrev, domingoPrev);
  const sobranteAnterior = Math.max(0, cargadoPrev - usadoPrev);
  return { cargadoSemana, sobranteAnterior, limiteTotal: cargadoSemana + sobranteAnterior };
}

function renderDieselGastoCargasCharts() {

  const DIAS_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fechasSemana = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(lunesDia); d.setDate(lunesDia.getDate() + i);
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    fechasSemana.push({ iso, label: DIAS_CORTO[d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '-' + MESES_CORTO[d.getMonth()] });
  }
  const porDiaMap = {};
  dieselJuanCargas.filter(r => r.fecha && fechaEnRango(r.fecha, lunesDia, domingoDia)).forEach(r => {
    porDiaMap[r.fecha] = (porDiaMap[r.fecha] || 0) + (parseFloat(r.litros) || 0);
  });
  const labelsDia = fechasSemana.map(f => f.label);
  const dataPorDia = fechasSemana.map(f => porDiaMap[f.iso] || 0);

  const cargasOrdenadas = [...dieselJuanCargas].filter(r=>r.fecha).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));

  // Litros por Unidad = litros usados agrupados por camión/equipo (de las salidas de ESTA SEMANA,

  const porEquipoSalidas = calcPorEquipoJuanSalidas(true);

  const labelsUnidad = equiposConSalidas.map(eq => dieselLabel(eq));
  const dataUnidad = equiposConSalidas.map(eq => porEquipoSalidas[eq]?.litros || 0);
  const colorsUnidad = equiposConSalidas.map(eq => dieselColorOf(eq).text);

  // ── Gráfica 1: Litros por Día (mismo look que Litros por Unidad: barras slate + barra Total oscura) ──
  const totalDia = dataPorDia.reduce((s,v)=>s+(v||0),0);
  const diaTotalEl = document.getElementById('dieselDiaTotal');

      }}
  });

  // ── Gráfica 3: Semáforo de Saldo — Gasto por Unidad de la semana vs. Límite Semanal fijo asignado a Juan ──
  const hoySem = new Date();
  const diaSem = hoySem.getDay(); // 0=Dom,1=Lun,...6=Sáb

    if (!fechaStr) return false;
    const d = new Date(fechaStr + 'T12:00:00');

    }
  }

  if (dieselGastoComparativaChart) { dieselGastoComparativaChart.destroy(); dieselGastoComparativaChart = null; }
  const cc = document.getElementById('dieselGastoComparativaChart');
  if (cc) dieselGastoComparativaChart = new Chart(cc, {

// Calcula cuánto lleva gastado Juan esta semana vs. su límite asignado.
function getDieselJuanEstadoSemanal() {
  const hoySem = new Date();
  const diaSem = hoySem.getDay();
  const diffLunes = (diaSem === 0 ? -6 : 1 - diaSem);
  const lunesSemana = new Date(hoySem); lunesSemana.setHours(0,0,0,0); lunesSemana.setDate(hoySem.getDate() + diffLunes);
  const domingoSemana = new Date(lunesSemana); domingoSemana.setDate(lunesSemana.getDate() + 6); domingoSemana.setHours(23,59,59,999);
  const salidasSemana = dieselJuanSalidas.filter(r => {
    if (!r.fecha) return false;
    const d = new Date(r.fecha + 'T12:00:00');
    return d >= lunesSemana && d <= domingoSemana;
  });
  const totalSalidaSemana = salidasSemana.reduce((s,r)=>s+(parseFloat(r.litros)||0),0);
  const limiteSemanal = calcDieselJuanSemana().limiteTotal;
  const umbralAlerta = parseFloat(dieselJuanUmbralAlerta) || 0;
  const restanteSemana = limiteSemanal - totalSalidaSemana;
  let estado = 'verde';
  if (restanteSemana < 0) estado = 'rojo';
  else if (restanteSemana <= umbralAlerta) estado = 'amarillo';
  return { restanteSemana, limiteSemanal, umbralAlerta, totalSalidaSemana, estado };
}

// Se llama al abrir el rubro de Diesel: si Juan ya está por acabarse su límite semanal, avisa.
function checkDieselJuanAlerta() {
  const est = getDieselJuanEstadoSemanal();
  if (est.limiteSemanal <= 0) return; // sin límite configurado, no hay nada que avisar
  if (est.estado === 'amarillo') {
    alert(`⚠️ Atención: a Juan le quedan ${est.restanteSemana.toLocaleString('es-MX')} L de su límite semanal de ${est.limiteSemanal.toLocaleString('es-MX')} L.\nSe está acercando al límite.`);
  } else if (est.estado === 'rojo') {
    alert(`🔴 Juan ya superó su límite semanal de diesel.\nLímite: ${est.limiteSemanal.toLocaleString('es-MX')} L · Usado: ${est.totalSalidaSemana.toLocaleString('es-MX')} L.`);
  }
}

function calcPorEquipoDiesel() {
  const porEquipo = {};
  dieselAllEquipoKeys().forEach(eq => porEquipo[eq] = { litros:0, costo:0, regs:0 });
  dieselEqData.forEach(r => {
    if (!porEquipo[r.equipo]) porEquipo[r.equipo] = { litros:0, costo:0, regs:0 };
    porEquipo[r.equipo].litros += r.litros||0;
    porEquipo[r.equipo].costo += r.costo||0;
    porEquipo[r.equipo].regs++;
  });
  return porEquipo;
}

  const totalLitros = dieselEqData.reduce((s,r)=>s+(r.litros||0),0);

    <div class="viaje-stat"><div class="viaje-stat-label">Total Costo (gasto)</div><div class="viaje-stat-val" style="color:#dc2626;font-size:17px">${fmt(totalCosto)}</div></div>`;

  // Resumen por equipo
  const porEquipo = calcPorEquipoDiesel();
  if (porEquipoEl) {
    porEquipoEl.innerHTML = `<table class="viajes-table"><thead><tr><th>Equipo</th><th style="text-align:right">Registros</th><th style="text-align:right">Litros</th><th style="text-align:right">Costo</th></tr></thead><tbody>

        const d = porEquipo[eq]; const tc = dieselColorOf(eq);
        return `<tr><td><span style="background:${tc.bg};color:${tc.text};padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;">${dieselLabel(eq)}</span></td>
          <td style="text-align:right">${d.regs}</td>
          <td style="text-align:right">${d.litros>0?d.litros.toLocaleString('es-MX')+' L':'—'}</td>
          <td style="text-align:right;color:#dc2626;font-weight:600">${d.costo>0?fmt(d.costo):'—'}</td></tr>`;
      }).join('')}
      <tr style="font-weight:600;background:var(--gray-50);">
        <td>TOTAL</td><td style="text-align:right">${dieselEqData.length}</td>
        <td style="text-align:right">${totalLitros.toLocaleString('es-MX')} L</td>
        <td style="text-align:right;color:#dc2626">${fmt(totalCosto)}</td>
      </tr>
    </tbody></table>`;

  renderDieselCharts(porEquipo, totalLitros, totalCosto);

function renderDieselCharts(porEquipo, totalLitros, totalCosto) {
  porEquipo = porEquipo || calcPorEquipoDiesel();

  // ── Gráfica 1: gasto por unidad ──
  const todosLosEquipos = dieselAllEquipoKeys();
  const equiposConDatos = todosLosEquipos.filter(eq => (porEquipo[eq]?.regs || 0) > 0);
  const listaEquiposUnidad = (equiposConDatos.length ? equiposConDatos : todosLosEquipos);
  const labelsUnidad = listaEquiposUnidad.map(eq => dieselLabel(eq));
  const dataUnidad = listaEquiposUnidad.map(eq => porEquipo[eq]?.costo || 0);
  const dataLitrosUnidad = listaEquiposUnidad.map(eq => porEquipo[eq]?.litros || 0);
  const colorsUnidad = listaEquiposUnidad.map(eq => dieselColorOf(eq).text);

  if (dieselChartUnidad) { dieselChartUnidad.destroy(); dieselChartUnidad = null; }
  const cu = document.getElementById('dieselChartUnidad');
  if (cu) dieselChartUnidad = new Chart(cu, {
    type: 'bar',
    data: { labels: labelsUnidad, datasets: [
      {
        label: 'Costo',
        data: dataUnidad,
        backgroundColor: colorsUnidad.map(c => c + 'bb'),
        borderColor: colorsUnidad, borderWidth: 1, borderRadius: 3,
        yAxisID: 'yCosto'
      },
      {
        label: 'Litros',
        data: dataLitrosUnidad,
        backgroundColor: colorsUnidad.map(c => c + '55'),
        borderColor: colorsUnidad, borderWidth: 1, borderRadius: 3,
        yAxisID: 'yLitros'
      }
    ]},
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:true, position:'top', align:'end', labels:{font:{size:10}, boxWidth:12, color:'#64748b'}},
        tooltip:{callbacks:{label:ctx=> ctx.dataset.label==='Costo' ? ('Costo: '+fmt(ctx.parsed.y||0)) : ('Litros: '+(ctx.parsed.y||0).toLocaleString('es-MX')+' L')}}
      },
      scales:{
        x:{ticks:{font:{size:10},color:'#94a3b8'},grid:{display:false}},
        yCosto:{position:'left',ticks:{font:{size:10},color:'#94a3b8',callback:v=>'$'+(v/1000).toFixed(0)+'k'},grid:{color:'rgba(0,0,0,0.05)'}},
        yLitros:{position:'right',ticks:{font:{size:10},color:'#94a3b8',callback:v=>v+'L'},grid:{display:false}}
      }}
  });

  // ── Gráfica 2: consumo acumulado en el tiempo ──
  const ordenados = [...dieselEqData].filter(r=>r.fecha).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  let acumulado = 0;
  const labelsAcum = [];
  const dataAcum = [];
  ordenados.forEach(r => {
    acumulado += parseFloat(r.costo) || 0;
    labelsAcum.push(new Date(r.fecha+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short'}));
    dataAcum.push(acumulado);
  });

  if (dieselChartAcumulado) { dieselChartAcumulado.destroy(); dieselChartAcumulado = null; }
  const ca = document.getElementById('dieselChartAcumulado');
  if (ca) dieselChartAcumulado = new Chart(ca, {
    type: 'line',
    data: { labels: labelsAcum, datasets: [{
      data: dataAcum, borderColor: '#dc2626', backgroundColor: 'rgba(220,38,38,0.1)',
      borderWidth: 2, pointRadius: labelsAcum.length>25?0:3, fill: true, tension: 0.25
    }]},
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},
      tooltip:{callbacks:{label:ctx=>fmt(ctx.parsed.y||0)}}},
      scales:{
        x:{ticks:{autoSkip:true,maxTicksLimit:8,font:{size:10},color:'#94a3b8'},grid:{display:false}},
        y:{ticks:{font:{size:10},color:'#94a3b8',callback:v=>'$'+(v/1000).toFixed(0)+'k'},grid:{color:'rgba(0,0,0,0.05)'}}
      }}
  });
}

function renderDieselEqTable() {
  const tbody = document.getElementById('dieselEqTbody');
  const empty = document.getElementById('dieselEqEmpty');
  const countEl = document.getElementById('dieselEqCount');
  if (!tbody) return;

  const filtered = dieselEqData.filter(r => dieselEqFiltroEquipo === 'todos' || r.equipo === dieselEqFiltroEquipo);
  const realIndices = dieselEqData.reduce((acc, r, i) => {
    if (dieselEqFiltroEquipo === 'todos' || r.equipo === dieselEqFiltroEquipo) acc.push(i);
    return acc;
  }, []);

  if (countEl) countEl.textContent = `${filtered.length} registro${filtered.length!==1?'s':''}`;

  refreshDieselEqAggregates();

  if (filtered.length === 0) { tbody.innerHTML=''; if(empty) empty.style.display='block'; return; }
  if (empty) empty.style.display = 'none';

  tbody.innerHTML = filtered.map((r, fi) => {
    const ri = realIndices[fi];
    const esCustom = !DIESEL_EQUIPOS.includes(r.equipo);
    const tc = dieselColorOf(r.equipo);
    return `<tr id="diesel-row-${ri}">
      <td style="color:var(--gray-400);font-size:11px">${fi+1}</td>

// Rubro Viajes: Cantidad × Precio Unitario = Monto total (usado en todos los reportes).
// Si no hay Cantidad capturada, el precio se usa directo como el monto total (compatibilidad).
function calcMontoPorCantidad(cantidad, precioUnit) {
  const c = parseFloat(cantidad) || 0;
  const p = parseFloat(precioUnit) || 0;
  return c > 0 ? c * p : p;
}
function recalcMontosViaje(v) {
  v.monto = calcMontoPorCantidad(v.cantidad, v.precioUnitGasto);
  v.montoFinal = calcMontoPorCantidad(v.cantidad, v.precioUnitFinal);
}

// IVA (16%) — si el viaje tiene la casilla IVA marcada, el IVA se calcula sobre el Monto Inicial
// y ese IVA se suma al Monto Final, para todos los totales
const IVA_RATE_VIAJES = 0.16;
function montoConIva(montoFinal, monto, tieneIva) {
  const baseFinal = parseFloat(montoFinal) || 0;
  const baseInicial = parseFloat(monto) || 0;
  return tieneIva ? baseFinal + (baseInicial * IVA_RATE_VIAJES) : baseFinal;
}

}

function renderClienteDash() {
  const content = document.getElementById('clienteDashContent');
  const countEl = document.getElementById('clienteCount');
  if (!content) return;

  // Filtrar por rango de fechas (si se definió)
  const enRango = (v) => {
    if (viajesBalDesde && v.fecha < viajesBalDesde) return false;
    if (viajesBalHasta && v.fecha > viajesBalHasta) return false;
    return true;
  };

  // Agrupar por cliente (normalizado: trim + lowercase para comparar)
  const grupos = {};
  viajesData.filter(enRango).forEach(v => {
    const key = (v.cliente || '').trim();
    if (!key) return;
    const norm = key.toLowerCase();
    if (!grupos[norm]) grupos[norm] = { nombre: key, viajes: [] };
    grupos[norm].viajes.push(v);
  });

  const clientes = Object.values(grupos);
  const rangoTxt = (viajesBalDesde || viajesBalHasta) ? ` · ${viajesBalDesde||'inicio'} a ${viajesBalHasta||'hoy'}` : '';
  if (countEl) countEl.textContent = `· ${clientes.length} cliente${clientes.length!==1?'s':''} encontrado${clientes.length!==1?'s':''}${rangoTxt}`;

  if (clientes.length === 0) {

      porTipo[v.tipo].monto += v.monto||0;
      porTipo[v.tipo].montoFinal += montoConIva(v.montoFinal, v.montoFinal, v.ivaFinal);

          </tr>
        </tbody>
      </table>
    </div>`;
  }).join('');
}

function updateViaje(i, campo, val) {
  if (regBloqueado(viajesData[i])) return;
  if (campo === 'iva' || campo === 'ivaFinal') {
    viajesData[i][campo] = !!val;
  } else {
    viajesData[i][campo] = (campo==='monto'||campo==='montoFinal'||campo==='cantidad'||campo==='tiempoExtra'||campo==='precioUnitGasto'||campo==='precioUnitFinal') ? (parseFloat(val)||0) : val;
  }
  if (campo === 'cantidad' || campo === 'precioUnitGasto' || campo === 'precioUnitFinal') {
    recalcMontosViaje(viajesData[i]);
  }
  if (campo==='montoFinal' || campo==='precioUnitFinal' || campo==='cantidad' || campo==='fecha' || campo==='iva' || campo==='ivaFinal') recalcViajesEnIngresos();
  guardarDatos();
  renderViajesTable();
}

// Suma los montoFinal (con IVA incluido si la casilla está marcada) de cada viaje al item "Viajes" de Ingresos Rentas, por mes
function recalcViajesEnIngresos() {
  const modRentas = MODULES.find(m => m.id === 'ing_rentas');
  if (!modRentas) return;
  let itemViajes = modRentas.items.find(it => it.isViajes);
  if (!itemViajes) return;
  const nuevos = new Array(12).fill(0);
  viajesData.forEach(v => {
    const mes = new Date(v.fecha + 'T12:00:00').getMonth(); // 0-11
    nuevos[mes] += montoConIva(v.montoFinal, v.montoFinal, v.ivaFinal);
  });
  itemViajes.vals = nuevos;
  // re-render tabla de rentas si está visible
  renderModuleTable(modRentas);
  refreshDashboard();
  guardarDatos();
}

  const key = (nombre || '').trim().toLowerCase();

  if (nominaEmpleadoIds[key] == null) {
    nominaEmpleadoIds[key] = nominaEmpleadoIdSeq++;
  }
  return nominaEmpleadoIds[key];
}

  return id == null ? '—' : String(id).padStart(3, '0');

// ── Horas extra ligadas a Nómina ─────────────────────────────────────────
// Las horas extra se registran en Viajes, Maquinaria Pesada y Maquinaria Ligera (columna "Hrs. Extra" por chofer).
// Al escribir el nombre en Nómina, si coincide con el chofer (sin importar mayúsculas/acentos), se jalan sus
// horas pendientes (registradas − ya cobradas en nóminas anteriores) y se multiplican por el costo por hora.
function normNombreHE(s) {
  return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
}
function calcHorasExtraPersona(nombre) {
  const n = normNombreHE(nombre);
  const out = { viajes: 0, pesada: 0, ligera: 0, total: 0, yaPagadas: 0, pendientes: 0 };
  if (!n) return out;
  const suma = arr => arr.reduce((t, r) => normNombreHE(r.chofer) === n ? t + (parseFloat(r.tiempoExtra) || 0) : t, 0);
  const r2 = v => Math.round(v * 100) / 100;
  out.viajes = r2(suma(viajesData));
  out.pesada = r2(suma(retroData));
  out.ligera = r2(suma(maqLigData));
  out.total = r2(out.viajes + out.pesada + out.ligera);
  out.yaPagadas = r2(nominaData.reduce((t, r) => normNombreHE(r.persona) === n ? t + (parseFloat(r.hrsExtraCobradas) || 0) : t, 0));
  out.pendientes = Math.max(0, r2(out.total - out.yaPagadas));
  return out;
}

function refrescarHorasExtraNomina() {
  const check = document.getElementById('nominaHorasExtraCheck');
  if (!check) return;
  const wrap = document.getElementById('nominaHorasExtraWrap');
  const input = document.getElementById('nominaHorasExtraInput');
  const info = document.getElementById('nominaHorasExtraInfo');
  const nombre = (document.getElementById('nominaNombreInput').value || '').trim();
  const h = calcHorasExtraPersona(nombre);

  if (h.pendientes > 0) {
    if (!check.checked) { check.checked = true; nominaHorasExtraAuto = true; }
    wrap.style.display = 'flex';
    input.value = nominaCostoHoraExtra > 0 ? Math.round(h.pendientes * nominaCostoHoraExtra * 100) / 100 : '';
    const partes = [];
    if (h.viajes > 0) partes.push('Viajes ' + h.viajes);
    if (h.pesada > 0) partes.push('Maq. Pesada ' + h.pesada);
    if (h.ligera > 0) partes.push('Maq. Ligera ' + h.ligera);
    info.textContent = '⏱️ ' + h.pendientes + ' hrs extra pendientes (' + partes.join(' · ') + ')' +
      (h.yaPagadas > 0 ? ' — ya cobradas antes: ' + h.yaPagadas : '') +
      (nominaCostoHoraExtra > 0 ? '' : ' — define el costo por hora para calcular el monto');
  } else {
    if (check.checked && nominaHorasExtraAuto) {
      check.checked = false; nominaHorasExtraAuto = false;
      wrap.style.display = 'none'; input.value = '';
    }
    if (check.checked) {
      info.textContent = !nombre ? 'Escribe el nombre para jalar sus horas extra registradas.'
        : (h.total > 0 ? 'Todas sus horas extra (' + h.total + ') ya fueron cobradas en nóminas anteriores.'
                       : 'No hay horas extra registradas con ese nombre de chofer; captura el monto a mano.');
    } else {
      info.textContent = '';
    }
  }
  actualizarTotalNominaPreview();
}

// El costo por hora extra es editable y se recuerda; al cambiarlo se recalcula el monto.
function onNominaCostoHoraInput() {
  nominaCostoHoraExtra = parseFloat(document.getElementById('nominaCostoHoraInput').value) || 0;
  guardarDatos();
  const nombre = (document.getElementById('nominaNombreInput').value || '').trim();
  const h = calcHorasExtraPersona(nombre);
  if (h.pendientes > 0) {
    document.getElementById('nominaHorasExtraInput').value = nominaCostoHoraExtra > 0 ? Math.round(h.pendientes * nominaCostoHoraExtra * 100) / 100 : '';
    refrescarHorasExtraNomina();
  } else {
    actualizarTotalNominaPreview();
  }
}

function onNominaPuestoChange() {
  const puesto = document.getElementById('nominaPuestoSel').value;

  const lista = document.getElementById('nominaNombreList');

  const otroInput = document.getElementById('nominaPuestoOtroInput');
  otroWrap.style.display = puesto === 'otros' ? 'flex' : 'none';
  if (puesto !== 'otros') otroInput.value = '';
  if (!puesto) {
    nombreInput.value = '';
    nombreInput.disabled = true;
    nombreInput.placeholder = 'Ej: Juan Pérez';
    lista.innerHTML = '';
    salarioInput.value = '';
    refrescarHorasExtraNomina();
    return;

  lista.innerHTML = Object.keys(cat.personas).map(p => `<option value="${p}">`).join('');
  salarioInput.value = '';
  refrescarHorasExtraNomina();
}

// El nombre se escribe manualmente. Si coincide con alguien ya conocido dentro
// del catálogo del puesto seleccionado, se sugiere su salario fijo ya establecido,
// pero el campo de salario siempre queda editable por si es una persona nueva.
function onNominaNombreInput() {
  const puesto = document.getElementById('nominaPuestoSel').value;
  const nombre = document.getElementById('nominaNombreInput').value.trim();
  const salarioInput = document.getElementById('nominaSalarioInput');
  refrescarHorasExtraNomina();
  if (!puesto || !nombre) return;
  const cat = NOMINA_CATALOG[puesto];
  const match = Object.keys(cat.personas).find(p => p.toLowerCase() === nombre.toLowerCase());
  if (match) salarioInput.value = cat.personas[match];
  actualizarTotalNominaPreview();
}

// Muestra/oculta los campos de caja de ahorro, horas extra y viáticos.
// Si el checkbox queda sin marcar, el campo se limpia y NO afecta el salario.
function toggleNominaExtra(tipo) {
  const map = {
    ahorro:      { check: 'nominaAhorroCheck',      wrap: 'nominaAhorroWrap',      input: 'nominaAhorroInput' },
    descuento:   { check: 'nominaDescuentoCheck',   wrap: 'nominaDescuentoWrap',   input: 'nominaDescuentoInput' },
    horasExtra:  { check: 'nominaHorasExtraCheck',  wrap: 'nominaHorasExtraWrap',  input: 'nominaHorasExtraInput' },
    viaticos:    { check: 'nominaViaticosCheck',    wrap: 'nominaViaticosWrap',    input: 'nominaViaticosInput' },
    martillo:    { check: 'nominaMartilloCheck',    wrap: 'nominaMartilloWrap',    input: 'nominaMartilloInput' },
    otros:       { check: 'nominaOtrosCheck',       wrap: 'nominaOtrosWrap',       input: 'nominaOtrosInput' },
  };
  const cfg = map[tipo];
  const checked = document.getElementById(cfg.check).checked;
  document.getElementById(cfg.wrap).style.display = checked ? 'flex' : 'none';
  if (!checked) {
    document.getElementById(cfg.input).value = '';
    if (tipo === 'otros') document.getElementById('nominaOtrosNotaInput').value = '';
    if (tipo === 'descuento') document.getElementById('nominaDescuentoNotaInput').value = '';
  }
  if (tipo === 'horasExtra') { nominaHorasExtraAuto = false; refrescarHorasExtraNomina(); return; }
  actualizarTotalNominaPreview();
}

// Recalcula en vivo el total a pagar mientras se llena el formulario.
function actualizarTotalNominaPreview() {
  const salario = parseFloat(document.getElementById('nominaSalarioInput').value) || 0;
  const horasExtra = document.getElementById('nominaHorasExtraCheck').checked
    ? (parseFloat(document.getElementById('nominaHorasExtraInput').value) || 0) : 0;
  const viaticos = document.getElementById('nominaViaticosCheck').checked
    ? (parseFloat(document.getElementById('nominaViaticosInput').value) || 0) : 0;
  const martillo = document.getElementById('nominaMartilloCheck').checked
    ? (parseFloat(document.getElementById('nominaMartilloInput').value) || 0) : 0;
  const otros = document.getElementById('nominaOtrosCheck').checked
    ? (parseFloat(document.getElementById('nominaOtrosInput').value) || 0) : 0;
  const ahorro = document.getElementById('nominaAhorroCheck').checked
    ? (parseFloat(document.getElementById('nominaAhorroInput').value) || 0) : 0;
  const descuento = document.getElementById('nominaDescuentoCheck').checked
    ? (parseFloat(document.getElementById('nominaDescuentoInput').value) || 0) : 0;
  const total = salario + horasExtra + viaticos + martillo + otros - ahorro - descuento;
  const el = document.getElementById('nominaTotalPreview');
  if (el) el.textContent = fmt(total) === '—' ? '$0' : fmt(total);
}

function agregarNomina() {
  const puesto = document.getElementById('nominaPuestoSel').value;
  const puestoOtro = puesto === 'otros' ? document.getElementById('nominaPuestoOtroInput').value.trim() : '';
  const persona = document.getElementById('nominaNombreInput').value.trim();
  const salarioBase = parseFloat(document.getElementById('nominaSalarioInput').value) || 0;

  const tieneAhorro = document.getElementById('nominaAhorroCheck').checked;
  const descuentoAhorro = tieneAhorro ? (parseFloat(document.getElementById('nominaAhorroInput').value) || 0) : 0;

  const tieneDescuento = document.getElementById('nominaDescuentoCheck').checked;
  const descuento = tieneDescuento ? (parseFloat(document.getElementById('nominaDescuentoInput').value) || 0) : 0;
  const descuentoNota = tieneDescuento ? document.getElementById('nominaDescuentoNotaInput').value.trim() : '';

  const tieneHorasExtra = document.getElementById('nominaHorasExtraCheck').checked;
  const horasExtra = tieneHorasExtra ? (parseFloat(document.getElementById('nominaHorasExtraInput').value) || 0) : 0;

  const tieneViaticos = document.getElementById('nominaViaticosCheck').checked;
  const viaticos = tieneViaticos ? (parseFloat(document.getElementById('nominaViaticosInput').value) || 0) : 0;

  const tieneMartillo = document.getElementById('nominaMartilloCheck').checked;
  const martillo = tieneMartillo ? (parseFloat(document.getElementById('nominaMartilloInput').value) || 0) : 0;

  const tieneOtros = document.getElementById('nominaOtrosCheck').checked;
  const otros = tieneOtros ? (parseFloat(document.getElementById('nominaOtrosInput').value) || 0) : 0;
  const otrosNota = tieneOtros ? document.getElementById('nominaOtrosNotaInput').value.trim() : '';

  if (!puesto || !persona) {
    mostrarMsgNomina('⚠️ Selecciona el tipo de persona y escribe su nombre antes de agregar.', 'error');
    return;
  }
  if (puesto === 'otros' && !puestoOtro) {
    mostrarMsgNomina('⚠️ Especifica el nombre de la categoría en "Otros".', 'error');
    return;
  }
  if (salarioBase <= 0) {
    mostrarMsgNomina('⚠️ El salario fijo debe ser mayor a $0.', 'error');
    return;
  }
  if (tieneAhorro && descuentoAhorro <= 0) {
    mostrarMsgNomina('⚠️ Indica el monto del descuento de caja de ahorro, o desmarca la casilla.', 'error');
    return;
  }
  if (tieneDescuento && descuento <= 0) {
    mostrarMsgNomina('⚠️ Indica el monto del descuento, o desmarca la casilla.', 'error');
    return;
  }
  if (tieneHorasExtra && horasExtra <= 0) {
    mostrarMsgNomina('⚠️ Indica el monto de horas extra, o desmarca la casilla.', 'error');
    return;
  }
  if (tieneViaticos && viaticos <= 0) {
    mostrarMsgNomina('⚠️ Indica el monto de viáticos, o desmarca la casilla.', 'error');
    return;
  }
  if (tieneMartillo && martillo <= 0) {
    mostrarMsgNomina('⚠️ Indica el monto de Hrs. Rotomartillo, o desmarca la casilla.', 'error');
    return;
  }
  if (tieneOtros && otros <= 0) {
    mostrarMsgNomina('⚠️ Indica el monto de Otros, o desmarca la casilla.', 'error');
    return;
  }
  if ((descuentoAhorro + descuento) > (salarioBase + horasExtra + viaticos + martillo + otros)) {
    mostrarMsgNomina('⚠️ Los descuentos no pueden ser mayores al total a pagar.', 'error');
    return;
  }

  const empleadoId = obtenerNominaEmpleadoId(persona);
  const montoNeto = salarioBase + horasExtra + viaticos + martillo + otros - descuentoAhorro - descuento;
  const registro = {
    puesto, puestoOtro, persona, empleadoId, salarioBase,
    tieneHorasExtra, horasExtra,
    hrsExtraCobradas: tieneHorasExtra ? calcHorasExtraPersona(persona).pendientes : 0,
    costoHoraExtra: tieneHorasExtra ? nominaCostoHoraExtra : 0,
    tieneViaticos, viaticos,
    tieneMartillo, martillo,
    tieneOtros, otros, otrosNota,
    tieneAhorro, descuentoAhorro,
    tieneDescuento, descuento, descuentoNota,
    _guardado: false,
    monto: montoNeto,
    mesIndex: new Date().getMonth(),
    fechaISO: _fsIso(new Date()),
    fecha: new Date().toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' })
  };

  fsAsegurarVisible('nomina', registro.fechaISO);
  nominaData.unshift(registro);
  recalcNominaEnGastos();
  guardarDatos();
  renderNominaTable();

  // Reset form
  document.getElementById('nominaPuestoSel').value = '';
  document.getElementById('nominaPuestoOtroWrap').style.display = 'none';
  document.getElementById('nominaPuestoOtroInput').value = '';
  document.getElementById('nominaNombreInput').value = '';
  document.getElementById('nominaNombreInput').disabled = true;
  document.getElementById('nominaNombreList').innerHTML = '';
  document.getElementById('nominaSalarioInput').value = '';
  ['Ahorro','Descuento','HorasExtra','Viaticos','Martillo','Otros'].forEach(t => {
    document.getElementById(`nomina${t}Check`).checked = false;
    document.getElementById(`nomina${t}Wrap`).style.display = 'none';
    document.getElementById(`nomina${t}Input`).value = '';
  });
  nominaHorasExtraAuto = false;
  const heInfo = document.getElementById('nominaHorasExtraInfo');
  if (heInfo) heInfo.textContent = '';
  const notaEl = document.getElementById('nominaOtrosNotaInput');
  if (notaEl) notaEl.value = '';
  const descuentoNotaEl = document.getElementById('nominaDescuentoNotaInput');
  if (descuentoNotaEl) descuentoNotaEl.value = '';
  actualizarTotalNominaPreview();

  mostrarMsgNomina(`✅ ${persona} (N° ${formatEmpleadoId(empleadoId)}) agregado/a — total a pagar: $${montoNeto.toLocaleString('es-MX')}.`, 'ok');
  generarTicketNomina(registro);
}

function guardarNominaFila(i) {
  const r = nominaData[i]; if (!r || regBloqueado(r)) return;
  const row = document.getElementById('nomina-row-' + i);
  if (row) row.querySelectorAll('[data-field]').forEach(el => {
    const campo = el.dataset.field;
    if (campo === 'persona') {
      const n = (el.value || '').trim();
      if (n) { r.persona = n; r.empleadoId = obtenerNominaEmpleadoId(n); }
    } else r[campo] = parseFloat(el.value) || 0;
  });
  r.monto = (r.salarioBase||0) + (r.horasExtra||0) + (r.viaticos||0) + (r.martillo||0) + (r.otros||0) - (r.descuentoAhorro||0) - (r.descuento||0);
  r._guardado = true;
  recalcNominaEnGastos();
  guardarDatos();
  renderNominaTable();
}

function eliminarNomina(i) {
  const r = nominaData[i];
  if (confirm(`¿Eliminar el registro de "${r.persona}" ($${r.monto.toLocaleString('es-MX')})?\nEsta acción no se puede deshacer.`)) {
    nominaData.splice(i, 1);
    recalcNominaEnGastos();
    guardarDatos();
    renderNominaTable();
  }
}

function updateNominaVal(i, campo, val) {
  if (regBloqueado(nominaData[i])) return;
  const r = nominaData[i];
  if (['salarioBase','horasExtra','viaticos','martillo','otros','descuentoAhorro','descuento'].includes(campo)) {
    r[campo] = parseFloat(val) || 0;
    r.monto = (r.salarioBase||0) + (r.horasExtra||0) + (r.viaticos||0) + (r.martillo||0) + (r.otros||0) - (r.descuentoAhorro||0) - (r.descuento||0);
    recalcNominaEnGastos();
  } else if (campo === 'persona') {
    const nuevoNombre = (val || '').trim();
    if (nuevoNombre) {
      r.persona = nuevoNombre;
      r.empleadoId = obtenerNominaEmpleadoId(nuevoNombre);
    }
  } else {
    r[campo] = val;
  }
  guardarDatos();
  renderNominaTable();
}

function limpiarFiltroNomina() {
  const sel = document.getElementById('nominaFiltroSel');
  if (sel) sel.value = 'todos';
  fsReset('nomina');
  renderNominaTable();
}

function renderNominaTable() {
  const tbody = document.getElementById('nominaTbody');
  const empty = document.getElementById('nominaEmpty');
  const summary = document.getElementById('nominaSummary');
  const countEl = document.getElementById('nominaCount');
  if (!tbody) return;

  const filtro = (document.getElementById('nominaFiltroSel') || {}).value || 'todos';
  const filtered = nominaData.filter(r => (filtro === 'todos' || r.puesto === filtro) && fsPasa('nomina', fsFechaNomina(r)));
  const realIndices = nominaData.reduce((acc, r, i) => {
    if ((filtro === 'todos' || r.puesto === filtro) && fsPasa('nomina', fsFechaNomina(r))) acc.push(i);
    return acc;
  }, []);
  fsInfoSet('nomina', nominaData.map(r => fsFechaNomina(r)));

  if (countEl) countEl.textContent = `${filtered.length} registro${filtered.length !== 1 ? 's' : ''}`;

  // Summary
  const gastoBruto = nominaData.reduce((s, r) => s + (r.salarioBase||0) + (r.horasExtra||0) + (r.viaticos||0), 0);
  const totalPagado = nominaData.reduce((s, r) => s + (r.monto || 0), 0);
  const totalAhorro = nominaData.reduce((s, r) => s + (r.descuentoAhorro || 0), 0);
  const grupos = {};
  nominaData.forEach(r => { grupos[r.puesto] = (grupos[r.puesto] || 0) + 1; });
  const numCategorias = Object.keys(grupos).length;

  if (summary) summary.innerHTML = `
    <div class="nomina-stat"><div class="nomina-stat-label">Total Registros</div><div class="nomina-stat-val" style="color:#db2777">${nominaData.length}</div></div>
    <div class="nomina-stat"><div class="nomina-stat-label">Gasto Nómina (bruto)</div><div class="nomina-stat-val" style="color:#dc2626;font-size:16px">${gastoBruto > 0 ? fmt(gastoBruto) : '—'}</div></div>
    <div class="nomina-stat"><div class="nomina-stat-label">Total Pagado (neto)</div><div class="nomina-stat-val" style="color:#16a34a;font-size:16px">${totalPagado > 0 ? fmt(totalPagado) : '—'}</div></div>
    <div class="nomina-stat"><div class="nomina-stat-label">En Caja de Ahorro</div><div class="nomina-stat-val" style="color:#0891b2;font-size:16px">${totalAhorro > 0 ? fmt(totalAhorro) : '—'}</div></div>
    <div class="nomina-stat"><div class="nomina-stat-label">Tipos activos</div><div class="nomina-stat-val" style="color:#1d4ed8">${numCategorias}</div></div>`;

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    if (empty) empty.style.display = 'block';
  } else {
    if (empty) empty.style.display = 'none';

    tbody.innerHTML = filtered.map((r, fi) => {
      const ri = realIndices[fi];
      const cat = nominaCatFor(r);
      return `<tr id="nomina-row-${ri}">
        <td style="color:var(--gray-400);font-size:11px">${fi + 1}</td>
        <td style="font-size:12px;white-space:nowrap;color:var(--gray-600)">${r.fecha || '—'}</td>
        <td><span class="nomina-chip" style="background:${cat.color}18;color:${cat.color}">${cat.label}</span></td>
        <td><span class="nomina-chip" style="background:#f1f5f9;color:#334155;font-family:monospace">${formatEmpleadoId(r.empleadoId)}</span></td>
        <td style="font-weight:500">
          <input class="editable" type="text" value="${r.persona}" style="min-width:120px" data-field="persona" onchange="updateNominaVal(${ri},'persona',this.value)"/>
        </td>
        <td style="text-align:right">
          <input class="editable" type="number" value="${r.salarioBase || ''}" placeholder="0"
            style="max-width:85px" data-field="salarioBase" onchange="updateNominaVal(${ri},'salarioBase',this.value)"/>
        </td>
        <td style="text-align:right;color:#16a34a">
          ${r.tieneHorasExtra ? `<input class="editable" type="number" value="${r.horasExtra||''}" placeholder="0" style="max-width:75px;color:#16a34a" data-field="horasExtra" onchange="updateNominaVal(${ri},'horasExtra',this.value)"/>` : '—'}
          ${r.tieneHorasExtra && r.hrsExtraCobradas > 0 ? `<div style="font-size:9.5px;color:#64748b;margin-top:2px;">${r.hrsExtraCobradas} hrs${r.costoHoraExtra > 0 ? ` × ${fmt(r.costoHoraExtra)}` : ''}</div>` : ''}
        </td>
        <td style="text-align:right;color:#16a34a">
          ${r.tieneViaticos ? `<input class="editable" type="number" value="${r.viaticos||''}" placeholder="0" style="max-width:75px;color:#16a34a" data-field="viaticos" onchange="updateNominaVal(${ri},'viaticos',this.value)"/>` : '—'}
        </td>
        <td style="text-align:right;color:#0891b2">
          ${r.tieneOtros ? `<input class="editable" type="number" value="${r.otros||''}" placeholder="0" style="max-width:75px;color:#0891b2" data-field="otros" onchange="updateNominaVal(${ri},'otros',this.value)"/>` : '—'}
        </td>
        <td style="text-align:right;color:#7c3aed">
          ${r.tieneMartillo ? `<input class="editable" type="number" value="${r.martillo||''}" placeholder="0" style="max-width:75px;color:#7c3aed" data-field="martillo" onchange="updateNominaVal(${ri},'martillo',this.value)"/>` : '—'}
        </td>
        <td style="text-align:right;color:#dc2626">
          ${r.tieneAhorro ? `<input class="editable" type="number" value="${r.descuentoAhorro||''}" placeholder="0" style="max-width:75px;color:#dc2626" data-field="descuentoAhorro" onchange="updateNominaVal(${ri},'descuentoAhorro',this.value)"/>` : '—'}
        </td>
        <td style="text-align:right;color:#dc2626">
          ${r.tieneDescuento ? `<input class="editable" type="number" value="${r.descuento||''}" placeholder="0" style="max-width:75px;color:#dc2626" data-field="descuento" onchange="updateNominaVal(${ri},'descuento',this.value)" title="${(r.descuentoNota||'').replace(/"/g,'&quot;')}"/>${r.descuentoNota ? `<div style="font-size:10px;color:#94a3b8;max-width:90px;white-space:normal;line-height:1.2">${r.descuentoNota}</div>` : ''}` : '—'}
        </td>
        <td style="text-align:right;font-weight:600;color:#db2777">${fmt(r.monto)}</td>
        <td>
          <div class="acciones-cell">
            <button class="btn-print-cliente" onclick='generarTicketNomina(nominaData[${ri}])' title="Ver / reimprimir recibo">🧾</button>
            ${btnGuardarNuevo(r, `guardarNominaFila(${ri})`)}
            <button class="btn-viaje-del" onclick="eliminarNomina(${ri})" title="Eliminar registro">
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>
              Eliminar
            </button>
          </div>
        </td>
      </tr>`;
    }).join('');

    // Total row
    const total = filtered.reduce((s, r) => s + (r.monto || 0), 0);
    tbody.innerHTML += `<tr class="total-row">
      <td colspan="11">Total pagado ${filtro !== 'todos' ? '(filtrado)' : ''}</td>
      <td style="text-align:right;color:#db2777">${fmt(total)}</td>
      <td></td>
    </tr>`;
  }

  bloquearFilasGuardadas(tbody, 'nomina-row-', nominaData);
  renderNominaAhorroTable();
}

// Suma, por persona, cuánto se le ha descontado de caja de ahorro en todos sus
// registros — así se sabe cuánto hay que devolverle.
function renderNominaAhorroTable() {
  const tbody = document.getElementById('nominaAhorroTbody');
  const empty = document.getElementById('nominaAhorroEmpty');
  if (!tbody) return;

  const porPersona = {};
  nominaData.forEach(r => {
    if (!r.descuentoAhorro) return;
    const key = r.persona + '||' + r.puesto;
    if (!porPersona[key]) porPersona[key] = { persona: r.persona, puesto: r.puesto, total: 0, aportaciones: 0 };
    porPersona[key].total += r.descuentoAhorro;
    porPersona[key].aportaciones += 1;
  });

  const filas = Object.values(porPersona).sort((a,b) => b.total - a.total);

  if (filas.length === 0) {
    tbody.innerHTML = '';
    if (empty) empty.style.display = 'block';
    return;
  }
  if (empty) empty.style.display = 'none';

  tbody.innerHTML = filas.map(f => {
    const cat = nominaCatFor(f);
    return `<tr>
      <td style="font-weight:500">${f.persona}</td>
      <td><span class="nomina-chip" style="background:${cat.color}18;color:${cat.color}">${cat.label}</span></td>
      <td style="text-align:center">${f.aportaciones}</td>
      <td style="text-align:right;font-weight:600;color:#0891b2">${fmt(f.total)}</td>
    </tr>`;
  }).join('');
}

let nominaEmpleadoDashVisible = false;
function toggleNominaEmpleadoDash() {
  nominaEmpleadoDashVisible = !nominaEmpleadoDashVisible;
  const sec = document.getElementById('nominaEmpleadoDashSection');
  if (nominaEmpleadoDashVisible) {
    sec.style.display = 'block';
    renderNominaEmpleadoDash();
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    sec.style.display = 'none';
  }
}

// Agrupa TODOS los registros de nómina por número de empleado (no por registro
// individual), sumando cantidades y contando cuántos tickets lleva cada persona.
function renderNominaEmpleadoDash() {
  const content = document.getElementById('nominaEmpleadoDashContent');
  const countEl = document.getElementById('nominaEmpleadoCount');
  if (!content) return;

  const grupos = {};
  nominaData.forEach(r => {
    const id = r.empleadoId != null ? r.empleadoId : obtenerNominaEmpleadoId(r.persona);
    if (!grupos[id]) grupos[id] = { empleadoId: id, nombre: r.persona, puesto: r.puesto, registros: [] };
    grupos[id].nombre = r.persona; // se queda con el nombre más reciente usado
    grupos[id].puesto = r.puesto;
    grupos[id].registros.push(r);
  });

  const empleados = Object.values(grupos).sort((a,b) => a.empleadoId - b.empleadoId);
  if (countEl) countEl.textContent = `· ${empleados.length} persona${empleados.length!==1?'s':''} encontrada${empleados.length!==1?'s':''}`;

  if (empleados.length === 0) {
    content.innerHTML = `<div class="no-clientes"><div style="font-size:32px;margin-bottom:10px">👤</div><div>No hay registros de nómina todavía. Agrega un pago para ver el balance por persona.</div></div>`;
    return;
  }

  const COLORES = ['#db2777','#7c3aed','#1d4ed8','#d97706','#0891b2','#16a34a','#dc2626','#64748b'];

  content.innerHTML = empleados.map((emp, ei) => {
    const color = COLORES[ei % COLORES.length];
    const totalSalario = emp.registros.reduce((s,r)=>s+(r.salarioBase||0),0);
    const totalHorasExtra = emp.registros.reduce((s,r)=>s+(r.horasExtra||0),0);
    const totalViaticos = emp.registros.reduce((s,r)=>s+(r.viaticos||0),0);
    const totalOtros = emp.registros.reduce((s,r)=>s+(r.otros||0),0);
    const totalMartillo = emp.registros.reduce((s,r)=>s+(r.martillo||0),0);
    const totalAhorro = emp.registros.reduce((s,r)=>s+(r.descuentoAhorro||0),0);
    const totalNeto = emp.registros.reduce((s,r)=>s+(r.monto||0),0);

    const detalleRows = emp.registros.map(r => {
      const cat = nominaCatFor(r);
      return `<tr>
        <td>${r.fecha||'—'}</td>
        <td><span class="nomina-chip" style="background:${cat.color}18;color:${cat.color}">${cat.label}</span></td>
        <td style="text-align:right;color:#dc2626">${fmt(r.salarioBase||0)}</td>
        <td style="text-align:right;color:#16a34a">${(r.horasExtra||0)>0?fmt(r.horasExtra):'—'}</td>
        <td style="text-align:right;color:#16a34a">${(r.viaticos||0)>0?fmt(r.viaticos):'—'}</td>
        <td style="text-align:right;color:#0891b2">${(r.otros||0)>0?fmt(r.otros):'—'}</td>
        <td style="text-align:right;color:#dc2626">${(r.descuentoAhorro||0)>0?fmt(r.descuentoAhorro):'—'}</td>
        <td style="text-align:right;font-weight:600;color:#db2777">${fmt(r.monto)}</td>
      </tr>`;
    }).join('');

    return `<div class="cliente-card">
      <div class="cliente-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:36px;height:36px;border-radius:50%;background:${color}22;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:${color}">${emp.nombre.charAt(0).toUpperCase()}</div>
          <div>
            <div class="cliente-nombre">${emp.nombre} <span class="nomina-chip" style="background:#f1f5f9;color:#334155;font-family:monospace;margin-left:4px">N° ${formatEmpleadoId(emp.empleadoId)}</span></div>
            <div style="font-size:11px;color:var(--gray-400)">${emp.registros.length} ticket${emp.registros.length!==1?'s':''}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="btn-print-cliente" onclick="imprimirNominaEmpleado(${emp.empleadoId})">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" style="width:12px;height:12px"><rect x="2" y="5" width="10" height="7" rx="1"/><path d="M4 5V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><rect x="4" y="8" width="6" height="1.5" rx="0.5" fill="currentColor" stroke="none"/></svg>
            Imprimir
          </button>
        </div>
      </div>
      <div class="cliente-metricas">
        <div class="cli-metric"><div class="cli-metric-label">Total Tickets</div><div class="cli-metric-val" style="color:${color}">${emp.registros.length}</div></div>
        <div class="cli-metric"><div class="cli-metric-label">Salario Total</div><div class="cli-metric-val" style="color:#dc2626">${totalSalario>0?fmt(totalSalario):'—'}</div></div>
        <div class="cli-metric"><div class="cli-metric-label">H. Extra + Viáticos + Otros</div><div class="cli-metric-val" style="color:#16a34a">${(totalHorasExtra+totalViaticos+totalOtros)>0?fmt(totalHorasExtra+totalViaticos+totalOtros):'—'}</div></div>

  const html = `<!DOCTYPE html><html lang="es"><head>

// Genera un ticket imprimible con todos los datos ya seleccionados del pago de nómina.
function generarTicketNomina(r) {
  const cat = nominaCatFor(r);
  const fecha = r.fecha || new Date().toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });

  const filas = [
    { label: 'Salario fijo', val: r.salarioBase, color:'#0f172a' },
  ];
  if (r.tieneHorasExtra) filas.push({ label: r.hrsExtraCobradas > 0 ? `+ Horas extra (${r.hrsExtraCobradas} hrs${r.costoHoraExtra > 0 ? ` × ${fmt(r.costoHoraExtra)}` : ''})` : '+ Horas extra', val: r.horasExtra, color:'#16a34a' });
  if (r.tieneViaticos) filas.push({ label: '+ Viáticos', val: r.viaticos, color:'#16a34a' });
  if (r.tieneMartillo) filas.push({ label: '+ Hrs. Rotomartillo', val: r.martillo, color:'#7c3aed' });
  if (r.tieneOtros) filas.push({ label: r.otrosNota ? `+ Otros (${r.otrosNota})` : '+ Otros', val: r.otros, color:'#0891b2' });
  if (r.tieneAhorro) filas.push({ label: '− Caja de ahorro', val: -r.descuentoAhorro, color:'#0891b2' });
  if (r.tieneDescuento) filas.push({ label: r.descuentoNota ? `− Descuento (${r.descuentoNota})` : '− Descuento', val: -r.descuento, color:'#dc2626' });

  const filasHtml = filas.map(f => `

      <td style="padding:7px 0;font-size:12.5px;text-align:right;font-weight:600;color:${f.color}">${f.val<0?'-':''}${fmt(Math.abs(f.val))}</td>

  const html = `<!DOCTYPE html><html lang="es"><head>
