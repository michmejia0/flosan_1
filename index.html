<head>

<title>FLOSAN — Control Financiero 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sidebar-w: 220px;
  --green: #16a34a;
  --green-light: #dcfce7;
  --green-mid: #4ade80;
  --red: #dc2626;
  --red-light: #fee2e2;
  --blue: #2563eb;
  --blue-light: #dbeafe;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-700: #334155;
  --gray-900: #0f172a;
  --white: #ffffff;
  --radius: 10px;
  --radius-sm: 6px;
}
body { font-family: 'Inter', sans-serif; background: var(--gray-100); color: var(--gray-900); display: flex; min-height: 100vh; font-size: 14px; }

/* SIDEBAR */
.sidebar { width: var(--sidebar-w); background: var(--gray-900); min-height: 100vh; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
.sidebar-brand { display: flex; align-items: center; justify-content: center; padding: 18px 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.brand-logo { width: 100%; max-width: 168px; height: auto; border-radius: 12px; flex-shrink: 0; box-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.12), 0 0 22px rgba(245,184,0,0.18); }
.brand-name { font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
.brand-name em { color: var(--green-mid); font-style: normal; }
.brand-sub { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
.sidebar-section { padding: 16px 10px 4px; font-size: 10px; font-weight: 600; color: var(--gray-400); letter-spacing: 0.8px; text-transform: uppercase; }
.sidebar-nav { flex: 1; padding: 4px 8px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--gray-400); font-size: 13px; transition: all .15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active { background: rgba(74,222,128,0.12); color: var(--green-mid); font-weight: 500; }
.nav-item .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.nav-item .nav-badge { margin-left: auto; font-size: 10px; background: rgba(255,255,255,0.1); color: var(--gray-400); padding: 1px 6px; border-radius: 10px; }
.nav-item.active .nav-badge { background: rgba(74,222,128,0.2); color: var(--green-mid); }
.nav-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 8px 10px; }
.nav-group-toggle { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none; cursor: pointer; padding: 10px 10px 6px; font-size: 10px; font-weight: 600; color: var(--gray-400); letter-spacing: 0.8px; text-transform: uppercase; text-align: left; border-radius: var(--radius-sm); transition: color .15s; }
.nav-group-toggle:hover { color: #fff; }
.nav-chevron { width: 10px; height: 10px; flex-shrink: 0; transition: transform .15s; transform: rotate(-90deg); }
.nav-chevron.open { transform: rotate(0deg); }
.nav-item-sub { padding-left: 18px; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: var(--gray-400); }

/* MAIN */
.main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { background: var(--white); border-bottom: 1px solid var(--gray-200); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--gray-900); }
.topbar-sub { font-size: 12px; color: var(--gray-400); font-weight: 400; margin-left: 8px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.year-badge { background: var(--gray-100); border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 4px 10px; font-size: 12px; color: var(--gray-500); font-weight: 500; }
.content { padding: 24px; flex: 1; }

/* SECTIONS */
.section { display: none; }
.section.visible { display: block; }

/* METRIC CARDS */
.metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.metric-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 16px 18px; }
.metric-card.accent-green { border-left: 3px solid var(--green); }
.metric-card.accent-red { border-left: 3px solid var(--red); }
.metric-card.accent-blue { border-left: 3px solid var(--blue); }
.metric-card.accent-amber { border-left: 3px solid var(--amber); }
.metric-label { font-size: 11px; font-weight: 500; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.metric-val { font-size: 22px; font-weight: 600; }
.metric-val.green { color: var(--green); }
.metric-val.red { color: var(--red); }
.metric-val.blue { color: var(--blue); }
.metric-val.amber { color: var(--amber); }

/* CARDS */
.card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.card-title small { font-size: 11px; font-weight: 400; color: var(--gray-400); }
.charts-row { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-bottom: 16px; }
.chart-wrap { position: relative; width: 100%; height: 240px; }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--gray-500); }
.leg-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

/* TABLE */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th { padding: 8px 10px; font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--gray-200); text-align: left; background: var(--gray-50); }
thead th:not(:first-child) { text-align: right; }
tbody td { padding: 8px 10px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); }
tbody td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.total-row td { font-weight: 600; background: var(--gray-50); color: var(--gray-900); }
tbody tr:hover td { background: var(--gray-50); }

/* MODULE HEADER */
.mod-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.mod-title-block { display: flex; align-items: center; gap: 10px; }
.mod-title { font-size: 16px; font-weight: 600; color: var(--gray-900); }
.badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.2px; }
.badge-in { background: var(--green-light); color: var(--green); }
.badge-out { background: var(--red-light); color: var(--red); }
.btn-add { display: inline-flex; align-items: center; gap: 5px; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background .15s; font-family: 'Inter', sans-serif; }
.btn-add:hover { background: #15803d; }
.btn-add svg { width: 13px; height: 13px; }

/* INPUTS */
.editable { border: none; background: transparent; width: 100%; text-align: right; font-size: 12.5px; color: var(--gray-700); font-family: 'Inter', sans-serif; min-width: 55px; }
.editable:focus { background: var(--blue-light); outline: none; border-radius: 3px; color: var(--blue); }
.name-input { border: none; background: transparent; font-size: 12.5px; color: var(--gray-700); font-family: 'Inter', sans-serif; min-width: 80px; width: 100%; }
.name-input:focus { background: var(--blue-light); outline: none; border-radius: 3px; padding: 0 3px; color: var(--blue); }

/* VIAJES */
.viajes-filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: flex-end; }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-label { font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px; }
.filter-select { border: 1px solid var(--gray-200); background: var(--white); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12.5px; color: var(--gray-700); font-family: 'Inter', sans-serif; cursor: pointer; min-width: 130px; }
.filter-select:focus { outline: none; border-color: var(--blue); }
.viajes-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 16px; }
.viaje-stat { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px 16px; }
.viaje-stat-label { font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
.viaje-stat-val { font-size: 20px; font-weight: 600; color: var(--gray-900); }
.viajes-table-wrap { overflow-x: auto; }
.viajes-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.viajes-table thead th { padding: 8px 10px; font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--gray-200); text-align: left; background: var(--gray-50); }
.viajes-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); vertical-align: middle; }
.viajes-table tbody tr:last-child td { border-bottom: none; }
.viajes-table tbody tr:hover td { background: var(--gray-50); }
.viaje-chip { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 600; }
.chip-arena { background: #fef9c3; color: #854d0e; }
.chip-grava { background: #e0f2fe; color: #0369a1; }
.chip-tepetate { background: #f3e8ff; color: #7e22ce; }
.chip-escombro { background: #fee2e2; color: #991b1b; }
.chip-balastro { background: #dcfce7; color: #166534; }
.chip-7m { background: #dbeafe; color: #1d4ed8; }
.chip-14m { background: #fef3c7; color: #92400e; }
.viaje-del { background: none; border: none; cursor: pointer; color: var(--gray-400); padding: 2px 4px; border-radius: 3px; font-size: 13px; line-height: 1; }
.viaje-del:hover { color: var(--red); background: var(--red-light); }
.viaje-input { border: none; background: transparent; font-size: 12.5px; color: var(--gray-700); font-family: 'Inter', sans-serif; width: 100%; }
.viaje-input:focus { background: var(--blue-light); outline: none; border-radius: 3px; padding: 0 3px; color: var(--blue); }
.viaje-input-date { border: 1px solid var(--gray-200); background: var(--white); border-radius: var(--radius-sm); font-size: 12px; color: var(--gray-700); font-family: 'Inter', sans-serif; padding: 3px 6px; }
.viaje-input-date:focus { outline: none; border-color: var(--blue); }
.viaje-select-inline { border: 1px solid var(--gray-200); background: var(--white); border-radius: 20px; font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; padding: 2px 8px; cursor: pointer; }
.viaje-select-inline:focus { outline: none; border-color: var(--blue); }

/* BOTONES GUARDAR / ELIMINAR VIAJE */
.btn-viaje-save { display:inline-flex;align-items:center;gap:3px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:4px 9px;font-size:11px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s; }
.btn-viaje-save:hover { background:#15803d; }
.btn-viaje-del { display:inline-flex;align-items:center;gap:3px;background:var(--red-light);color:var(--red);border:1px solid #fca5a5;border-radius:var(--radius-sm);padding:4px 9px;font-size:11px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s; }
.btn-viaje-del:hover { background:var(--red);color:#fff; }
.acciones-cell { display:flex;gap:5px;justify-content:flex-end;align-items:center; }
.badge-guardado { display:inline-flex;align-items:center;gap:3px;background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1;border-radius:var(--radius-sm);padding:4px 9px;font-size:11px;font-weight:500;white-space:nowrap; }
tr.fila-guardada { background:#f8fafc; }
tr.fila-guardada input:disabled, tr.fila-guardada select:disabled { opacity:1;-webkit-text-fill-color:currentColor;background:transparent;border-color:transparent;cursor:default;appearance:none;-webkit-appearance:none; }
.saved-flash { animation: savedFlash .6s ease; }
@keyframes savedFlash { 0%{background:#dcfce7} 100%{background:transparent} }

/* DASHBOARD CLIENTES */
.clientes-section { margin-top:24px; }
.cliente-card { background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px; }
.cliente-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:14px; }
.cliente-nombre { font-size:15px;font-weight:600;color:var(--gray-900); }
.cliente-metricas { display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px; }
.cli-metric { background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--radius-sm);padding:10px 12px; }
.cli-metric-label { font-size:10px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px; }
.cli-metric-val { font-size:16px;font-weight:600; }
.cliente-table { width:100%;border-collapse:collapse;font-size:12px; }
.cliente-table thead th { padding:6px 8px;font-size:10px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.4px;border-bottom:1px solid var(--gray-200);background:var(--gray-50);text-align:left; }
.cliente-table thead th:not(:first-child) { text-align:right; }
.cliente-table tbody td { padding:6px 8px;border-bottom:1px solid var(--gray-100);color:var(--gray-700); }
.cliente-table tbody td:not(:first-child) { text-align:right; }
.cliente-table tbody tr:last-child td { border-bottom:none; }
.no-clientes { text-align:center;padding:40px;color:var(--gray-400);font-size:13px; }
.btn-cliente-dash { display:inline-flex;align-items:center;gap:5px;background:#7c3aed;color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s;font-family:'Inter',sans-serif; }
.btn-cliente-dash:hover { background:#6d28d9; }
.btn-print-cliente { display:inline-flex;align-items:center;gap:5px;background:#f8fafc;color:#334155;border:1px solid #e2e8f0;border-radius:var(--radius-sm);padding:5px 11px;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif; }
.btn-print-cliente:hover { background:#e2e8f0;color:#0f172a; }

/* NÓMINA REG */
.nomina-add-form { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.nomina-form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.nomina-form-group { display: flex; flex-direction: column; gap: 5px; }
.nomina-form-label { font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px; }
.nomina-select { border: 1px solid var(--gray-200); background: var(--white); border-radius: var(--radius-sm); padding: 7px 11px; font-size: 13px; color: var(--gray-700); font-family: 'Inter', sans-serif; cursor: pointer; min-width: 180px; }
.nomina-select:focus { outline: none; border-color: var(--blue); }
.nomina-monto-input { border: 1px solid var(--gray-200); background: var(--white); border-radius: var(--radius-sm); padding: 7px 11px; font-size: 13px; color: var(--gray-700); font-family: 'Inter', sans-serif; min-width: 120px; }
.nomina-monto-input:focus { outline: none; border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
.nomina-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
.nomina-extra-block { background: var(--gray-50); border: 1px dashed var(--gray-200); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 190px; }
.nomina-check-label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--gray-700); cursor: pointer; user-select: none; }
.nomina-check-label input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #db2777; }
.nomina-total-preview { background: #fdf2f8; border: 1px solid #fbcfe8; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: #9d174d; display: flex; justify-content: space-between; align-items: center; }
.nomina-total-preview b { font-size: 16px; }
.nomina-ahorro-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.nomina-ahorro-table thead th { padding: 8px 10px; font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--gray-200); text-align: left; background: var(--gray-50); }
.nomina-ahorro-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); }
.nomina-stat { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px 16px; }
.nomina-stat-label { font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
.nomina-stat-val { font-size: 19px; font-weight: 600; }
.nomina-chip { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.nomina-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.nomina-table thead th { padding: 8px 10px; font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--gray-200); text-align: left; background: var(--gray-50); }
.nomina-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); vertical-align: middle; }
.nomina-table tbody tr:last-child td { border-bottom: none; }
.nomina-table tbody tr:hover td { background: var(--gray-50); }
.nomina-filter-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }

@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: fixed; top: 0; left: 0; width: 100%; background: #fff; padding: 24px; }
  .btn-print-cliente { display: none !important; }
}

.site-credit { margin-top:32px;padding:16px 0 8px;border-top:1px solid var(--gray-200);text-align:center;font-size:12px;color:var(--gray-400);line-height:1.7; }
.site-credit strong { color:var(--gray-500);font-weight:600; }
.site-credit a { color:var(--gray-500);text-decoration:none; }
.site-credit a:hover { text-decoration:underline; }
@media print { .site-credit { display:none; } }

/* DASHBOARD LOCK OVERLAY - replaced by modal */
</style>

    </div>
    <div style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.3px;">FLOS<span style="color:#4ade80;">AN</span></div>

    <div style="position:relative;width:100%;">
      <input id="dashPwInput" type="password" placeholder="Ingresa la contraseña…"
        style="width:100%;padding:11px 42px 11px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#fff;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;letter-spacing:2px;"

const CLAVE = 'Flosan234';
const SESSION_KEY = 'flosan_dash_auth';

let dashDesbloqueado = sessionStorage.getItem(SESSION_KEY) === '1';

function verificarDashPw() {
  const input = document.getElementById('dashPwInput').value;
  const errorEl = document.getElementById('dashPwError');
  if (input === CLAVE) {
    dashDesbloqueado = true;
    sessionStorage.setItem(SESSION_KEY, '1');
    cerrarDashModal();
    // Navegar al dashboard después de desbloquear
    setTab('dashboard');
  } else {
    errorEl.style.display = 'block';
    document.getElementById('dashPwInput').value = '';
    document.getElementById('dashPwInput').focus();
    document.getElementById('dashPwInput').style.borderColor = '#dc2626';
    setTimeout(() => { document.getElementById('dashPwInput').style.borderColor = ''; }, 1500);
  }
}

function abrirDashModal() {
  const modal = document.getElementById('dashLoginModal');
  modal.style.display = 'flex';
  document.getElementById('dashPwInput').value = '';
  document.getElementById('dashPwError').style.display = 'none';
  setTimeout(() => document.getElementById('dashPwInput').focus(), 100);
}

function cerrarDashModal() {
  document.getElementById('dashLoginModal').style.display = 'none';
}

function toggleDashPw() {
  const inp = document.getElementById('dashPwInput');
  const isHidden = inp.type === 'password';
  inp.type = isHidden ? 'text' : 'password';
  document.getElementById('dashEyeIcon').innerHTML = isHidden
    ? `<path d="M2 2l12 12M6.5 6.6A3 3 0 0 0 8 11a3 3 0 0 0 2.9-2.3M4.2 4.3C2.5 5.5 1 8 1 8s2.5 5 7 5a7.4 7.4 0 0 0 3.8-1.1M9.9 3.2A7 7 0 0 0 8 3C3.5 3 1 8 1 8s.7 1.5 2 2.8"/>`
    : `<path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/>`;
}

function fmt(n) {
  if (!n) return '—';
  return '$' + Math.round(n).toLocaleString('es-MX');
}
function totalRow(items, mi) {
  return items.reduce((s,it) => s + (parseFloat(it.vals[mi])||0), 0);
}
function allIngresos() { return MODULES.filter(m => m.type==='ingreso'); }
function allGastos() { return MODULES.filter(m => m.type==='gasto'); }
function ingTotales() { return MONTHS.map((_,mi) => allIngresos().reduce((s,m)=>s+totalRow(m.items,mi),0)); }
function gastosTotales() {
  // "Gastos Total" (pago_subrenta) ahora también refleja, solo para mostrar en
  // pantalla, los totales de Mantenimiento General/Bodega/Oficina. Para no
  // contarlos dos veces en el gran total, aquí solo se toman de ese módulo los
  // rubros "fuente" (Diesel y Nómina); Mant. General/Bodega/Oficina se cuentan
  // una sola vez desde sus propios módulos.
  return MONTHS.map((_,mi) => allGastos().reduce((s,m) => {
    if (m.id === 'pago_subrenta') {
      const soloFuente = m.items.filter(it => !it.isMantGeneralAuto && !it.isBodegaAuto && !it.isOficinaAuto);
      return s + totalRow(soloFuente, mi);
    }
    return s + totalRow(m.items, mi);
  }, 0));
}

function categoriasGasto() {
  const subrenta = MODULES.find(x=>x.id==='pago_subrenta');
  const nomina = subrenta ? subrenta.items.find(it=>it.isNominaNeto) : null;
  const dieselAuto = subrenta ? subrenta.items.find(it=>it.isDieselEquipo) : null;
  const mant = MODULES.find(x=>x.id==='mant_general');
  const bodega = MODULES.find(x=>x.id==='bodega');
  const oficina = MODULES.find(x=>x.id==='oficina');
  const choferes = MODULES.find(x=>x.id==='choferes');
  const sumVals = arr => (arr||[]).reduce((a,b)=>a+(parseFloat(b)||0),0);
  const sumMod = m => m ? MONTHS.reduce((s,_,mi)=>s+totalRow(m.items,mi),0) : 0;
  return [
    { name:'Nómina', color:'#db2777', total: sumVals(nomina && nomina.vals) },
    { name:'Diesel', color:'#dc2626', total: sumVals(dieselAuto && dieselAuto.vals) },
    { name: mant ? mant.name : 'Mantenimiento General', color: mant ? mant.color : '#d97706', total: sumMod(mant) },
    { name: bodega ? bodega.name : 'Construcción', color: bodega ? bodega.color : '#e24b4a', total: sumMod(bodega) },
    { name: oficina ? oficina.name : 'Gastos Oficina', color: oficina ? oficina.color : '#64748b', total: sumMod(oficina) },
    { name: choferes ? choferes.name : 'Gastos Choferes', color: choferes ? choferes.color : '#0d9488', total: sumMod(choferes) },
  ];
}

function setTab(id) {

  if (id === 'dashboard' && !dashDesbloqueado) {
    abrirDashModal();

  }
  activeTab = id;
  buildSideNav();
  document.querySelectorAll('.section').forEach(s => s.classList.remove('visible'));
  const sec = document.getElementById('sec_' + id);
  if (sec) sec.classList.add('visible');
  const m = MODULES.find(x=>x.id===id);
  if (id === 'dashboard') {
    document.getElementById('topbarTitle').textContent = 'Dashboard';
    document.getElementById('topbarSub').textContent = 'Resumen general';
    refreshDashboard();
  } else if (id === 'balance_general') {

  } else if (id === 'nomina_reg') {

  document.getElementById('dm-bal').textContent = fmt(tB);
  document.getElementById('dm-bal').className = 'metric-val '+(tB>=0?'green':'red');
  document.getElementById('dm-margin').textContent = tI>0?Math.round(tB/tI*100)+'%':'—';
  document.getElementById('dm-margin').className = 'metric-val '+(tB>=0?'green':'red');

function updateName(mid,ri,val){ const m=MODULES.find(x=>x.id===mid); if(m){ if (regBloqueado(m.items[ri])) return; m.items[ri].name=val; guardarDatos(); } }
function updateVal(mid,ri,mi,val){ const m=MODULES.find(x=>x.id===mid); if(m){ if (regBloqueado(m.items[ri])) return; m.items[ri].vals[mi]=parseFloat(val)||0; renderModuleTable(m); guardarDatos();} }
function addRow(mid){
  const m=MODULES.find(x=>x.id===mid);
  if(m){
    m.items.push({name:'Nuevo ítem',vals:new Array(12).fill(0), registros: m.dailyEntry ? [] : undefined, _guardado: m.dailyEntry ? undefined : false});
    renderModuleTable(m);
    if (m.dailyEntry) recalcTodasCategoriasEnGastosTotal(); else guardarDatos();
  }
}

// ── REGISTRO POR DÍA (Mantenimiento General, Construcción, Gastos Oficina) ──
// Recalcula los totales mensuales (vals) de un ítem a partir de sus registros diarios.
function recalcItemVals(item) {
  const nuevos = new Array(12).fill(0);
  (item.registros||[]).forEach(r => {
    if (!r.fecha) return;
    const mes = new Date(r.fecha+'T12:00:00').getMonth();
    if (mes>=0 && mes<12) nuevos[mes] += parseFloat(r.monto)||0;
  });
  item.vals = nuevos;
}

// Al cargar los datos guardados, asegura que los módulos de captura diaria tengan
// su arreglo de registros y, si un ítem trae totales mensuales heredados (viejos)
// pero aún no tiene ningún registro por día, migra esos totales a un registro
// sintético (día 1 de cada mes) para no perder el histórico ya capturado.
function migrarYRecalcularDiario() {
  MODULES.forEach(m => {
    if (!m.dailyEntry) return;
    m.items.forEach(it => {
      if (!it.registros) it.registros = [];
      if (it.registros.length===0 && Array.isArray(it.vals) && it.vals.some(v=>parseFloat(v)>0)) {
        it.vals.forEach((v,mi) => {
          const val = parseFloat(v)||0;
          if (val>0) {
            const mm = String(mi+1).padStart(2,'0');
            it.registros.push({ fecha: `2026-${mm}-01`, monto: val });
          }
        });
      }
      recalcItemVals(it);
    });
  });
}

function toggleDailyDetail(mid, ri) {
  const key = mid+'_'+ri;
  dailyRowExpanded[key] = !dailyRowExpanded[key];
  const m = MODULES.find(x=>x.id===mid);
  if (m) renderModuleTable(m);
}

function agregarRegistroDiario(mid, ri) {
  const m = MODULES.find(x=>x.id===mid); if (!m) return;
  const item = m.items[ri]; if (!item) return;
  const fechaInput = document.getElementById(`reg_fecha_${mid}_${ri}`);
  const montoInput = document.getElementById(`reg_monto_${mid}_${ri}`);
  const fecha = fechaInput ? fechaInput.value : '';
  const monto = parseFloat(montoInput ? montoInput.value : 0) || 0;
  if (!fecha) { alert('Selecciona una fecha.'); return; }
  if (!monto) { alert('Ingresa un monto mayor a 0.'); return; }
  if (!item.registros) item.registros = [];
  item.registros.unshift({ fecha, monto, _guardado: false });
  recalcItemVals(item);
  dailyRowExpanded[mid+'_'+ri] = true;
  renderModuleTable(m);
  recalcTodasCategoriasEnGastosTotal();
}

function eliminarRegistroDiario(mid, ri, idx) {
  const m = MODULES.find(x=>x.id===mid); if (!m) return;
  const item = m.items[ri]; if (!item || !item.registros) return;
  if (regBloqueado(item.registros[idx])) return;
  item.registros.splice(idx,1);
  recalcItemVals(item);
  renderModuleTable(m);
  recalcTodasCategoriasEnGastosTotal();
}

function guardarRegistroDiario(mid, ri, idx) {
  const m = MODULES.find(x=>x.id===mid); if (!m) return;
  const item = m.items[ri]; if (!item || !item.registros || !item.registros[idx]) return;
  if (regBloqueado(item.registros[idx])) return;
  item.registros[idx]._guardado = true;
  dailyRowExpanded[mid+'_'+ri] = true;
  renderModuleTable(m);
  recalcTodasCategoriasEnGastosTotal();
}

function guardarItemFila(mid, ri) {
  const m = MODULES.find(x=>x.id===mid); if (!m) return;
  const item = m.items[ri]; if (!item || regBloqueado(item)) return;
  const row = document.getElementById('item-row-'+mid+'-'+ri);
  if (row) {
    const n = row.querySelector('[data-field="name"]');
    if (n) item.name = n.value;
    item.vals.forEach((_,mi) => { const el = row.querySelector('[data-field="v'+mi+'"]'); if (el) item.vals[mi] = parseFloat(el.value)||0; });
  }
  item._guardado = true;
  renderModuleTable(m);
  guardarDatos();
}

function eliminarItemNuevo(mid, ri) {
  const m = MODULES.find(x=>x.id===mid); if (!m) return;
  const item = m.items[ri]; if (!item || item._guardado !== false) return;
  if (!confirm(`¿Eliminar el ítem "${item.name||'sin nombre'}"?\nEsta acción no se puede deshacer.`)) return;
  m.items.splice(ri,1);
  renderModuleTable(m);
  guardarDatos();
}

function actualizarMontoInicialCajaChica(val) {
  const item = getCajaChicaItem(); if (!item) return;
  item.montoInicial = parseFloat(val)||0;
  guardarDatos();
  renderCajaChica();
}

function agregarMovCajaChica() {
  const item = getCajaChicaItem(); if (!item) return;
  const hoy = new Date().toISOString().split('T')[0];
  fsAsegurarVisible('cajachica', hoy);
  if (!item.registros) item.registros = [];
  item.registros.unshift({ _guardado: false, fecha: hoy, descripcion: '', metodo: 'efectivo', monto: 0 });
  recalcItemVals(item);
  renderCajaChica();
  recalcTodasCategoriasEnGastosTotal();
}

function updateCajaChicaField(idx, campo, val) {
  const item = getCajaChicaItem(); if (!item || !item.registros || !item.registros[idx]) return;
  if (regBloqueado(item.registros[idx])) return;
  item.registros[idx][campo] = (campo === 'monto') ? (parseFloat(val)||0) : val;
  recalcItemVals(item);
  renderCajaChica();
  recalcTodasCategoriasEnGastosTotal();
}

function guardarMovCajaChicaFila(idx) {
  const item = getCajaChicaItem(); if (!item || !item.registros || !item.registros[idx]) return;
  const r = item.registros[idx]; if (regBloqueado(r)) return;
  leerCamposFila(document.getElementById('cajaChica-row-' + idx), r, ['monto']);
  r._guardado = true;
  recalcItemVals(item);
  renderCajaChica();
  recalcTodasCategoriasEnGastosTotal();
}

function eliminarMovCajaChica(idx) {
  const item = getCajaChicaItem(); if (!item || !item.registros) return;
  item.registros.splice(idx,1);
  recalcItemVals(item);
  renderCajaChica();
  recalcTodasCategoriasEnGastosTotal();
}

function confirmarEliminarMovCajaChica(idx) {
  const item = getCajaChicaItem(); if (!item || !item.registros) return;
  const r = item.registros[idx];
  const desc = (r && r.descripcion && r.descripcion.trim()) ? r.descripcion : 'sin descripción';
  if (confirm(`¿Eliminar el gasto "${desc}"?\nEsta acción no se puede deshacer.`)) eliminarMovCajaChica(idx);
}

const TIPOS_GASTO_CHOFER = ['Material', 'Tiro', 'Caseta', 'Otros'];
const METODOS_PAGO_CHOFER = ['Tarjeta', 'Efectivo'];

function getChoferesModule() { return MODULES.find(x => x.id === 'choferes'); }

// Devuelve el rango lunes–domingo (YYYY-MM-DD) de la semana actual.
// OJO: se llama distinto a getRangoSemanaActual() (la del módulo Diesel, que devuelve {lunes, domingo})
// porque si comparten nombre una pisa a la otra y los choferes dejan de leer la semana.
function getRangoSemanaChoferes() {
  const hoy = new Date();
  const diaSemana = hoy.getDay(); // 0=domingo..6=sábado
  const offsetLunes = diaSemana === 0 ? -6 : 1 - diaSemana;
  const lunes = new Date(hoy);
  lunes.setHours(0,0,0,0);
  lunes.setDate(hoy.getDate() + offsetLunes);
  const domingo = new Date(lunes);
  domingo.setDate(lunes.getDate() + 6);
  const pad = n => String(n).padStart(2,'0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; // fecha local, sin desfase UTC
  return { inicio: toISO(lunes), fin: toISO(domingo) };
}

// Solo cuentan los choferes que tengan al menos un viaje registrado DENTRO de la semana actual
// (lunes–domingo). Así evitamos que se pueda agregar/registrar gasto a un chofer que esa semana
// no tuvo viajes, aunque haya tenido viajes en semanas anteriores.
function getChoferesEnViajes() {
  const { inicio, fin } = getRangoSemanaChoferes();
  const set = new Set();
  (viajesData||[]).forEach(v => {
    const nombre = (v.chofer||'').trim();
    const fecha = v.fecha || '';
    if (nombre && fecha >= inicio && fecha <= fin) set.add(nombre);
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
}

// Obras en las que ese chofer trabajó esta semana (según Viajes), para autocompletar/seleccionar
// la obra de cada gasto sin tener que ir a revisar el rubro Viajes.
function getObrasChoferSemana(nombre) {
  const { inicio, fin } = getRangoSemanaChoferes();
  const n = (nombre||'').trim();
  if (!n) return [];
  const set = new Set();
  (viajesData||[]).forEach(v => {
    const fecha = v.fecha || '';
    const obra = (v.obra||'').trim();
    if ((v.chofer||'').trim() === n && obra && fecha >= inicio && fecha <= fin) set.add(obra);
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
}

  m.items.forEach((ch, ci) => (ch.registros || []).forEach((r, gi) => { if (regBloqueado(r)) bloquearFilaDOM(document.getElementById('chofgasto-' + ci + '-' + gi)); }));

  const nombre = (chofer.name || '').trim();

  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── FILTRO SEMANAL REUTILIZABLE (mismo comportamiento que el de Diesel) ──────────────
// Cada rubro tiene su propio estado (key): 'viajes', 'retro', 'maqlig', 'nomina', 'cajachica',
// 'choferes' y 'daily_<modulo>_<item>' (Mantenimiento General / Bodega, registro por día).
// Por defecto muestra solo la SEMANA ACTUAL (lunes–domingo). Solo filtra lo que se VE en la tabla:
// totales, saldos, balances y reportes siguen usando todos los registros.
const FS_ESTADO = {};
function fsEstado(key) { return FS_ESTADO[key] || (FS_ESTADO[key] = { modo: 'semana', desde: '', hasta: '' }); }
function _fsIso(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
// {desde, hasta} en YYYY-MM-DD, o null si se ve todo el historial
function fsRango(key) {
  const e = fsEstado(key);
  if (e.modo === 'todo') return null;
  if (e.modo === 'rango') return { desde: e.desde || '', hasta: e.hasta || '' };
  const hoy = new Date();
  const dif = hoy.getDay() === 0 ? -6 : 1 - hoy.getDay();
  const l = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + dif);
  const d = new Date(l.getFullYear(), l.getMonth(), l.getDate() + 6);
  if (e.modo === 'semana_pasada') { l.setDate(l.getDate() - 7); d.setDate(d.getDate() - 7); }
  return { desde: _fsIso(l), hasta: _fsIso(d) };
}
// Un registro sin fecha (recién agregado) siempre se muestra para que no se pierda
function fsPasa(key, f) {
  const r = fsRango(key);
  if (!r || !f) return true;
  const iso = String(f).slice(0, 10);
  if (r.desde && iso < r.desde) return false;
  if (r.hasta && iso > r.hasta) return false;
  return true;
}
function _fsCorta(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }); }
function fsInfoTexto(key, fechas) {
  const r = fsRango(key);
  if (!r) return 'Mostrando todo el historial';
  const ocultos = (fechas || []).filter(f => !fsPasa(key, f)).length;
  let rango;
  if (r.desde && r.hasta) rango = 'del ' + _fsCorta(r.desde) + ' al ' + _fsCorta(r.hasta);
  else if (r.desde) rango = 'desde el ' + _fsCorta(r.desde);
  else if (r.hasta) rango = 'hasta el ' + _fsCorta(r.hasta);
  else rango = 'sin límite de fechas';
  return 'Mostrando ' + rango + (ocultos ? ' · <strong>' + ocultos + '</strong> registro' + (ocultos !== 1 ? 's' : '') + ' fuera de este periodo' : '');
}
function fsInfoSet(key, fechas) {
  const el = document.getElementById('fsInfo_' + key);
  if (el) el.innerHTML = fsInfoTexto(key, fechas);
}
// HTML del filtro (select + fechas personalizadas + texto informativo)
function fsHtml(key, fechas) {
  const e = fsEstado(key);
  const inp = "border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:5px 8px;font-size:12.5px;font-family:'Inter',sans-serif;color:var(--gray-700);background:var(--white);";
  return `<div class="filter-group">
        <label class="filter-label">Ver registros de</label>
        <select class="filter-select" id="fsModo_${key}" onchange="fsCambiar('${key}')">
          <option value="semana" ${e.modo==='semana'?'selected':''}>Esta semana</option>
          <option value="semana_pasada" ${e.modo==='semana_pasada'?'selected':''}>Semana pasada</option>
          <option value="todo" ${e.modo==='todo'?'selected':''}>Todo el historial</option>
          <option value="rango" ${e.modo==='rango'?'selected':''}>Elegir fechas…</option>
        </select>
      </div>
      <div id="fsCustom_${key}" style="display:${e.modo==='rango'?'flex':'none'};gap:12px;align-items:flex-end;">
        <div class="filter-group"><label class="filter-label">Desde</label><input type="date" id="fsDesde_${key}" value="${e.desde}" onchange="fsCambiar('${key}')" style="${inp}"/></div>
        <div class="filter-group"><label class="filter-label">Hasta</label><input type="date" id="fsHasta_${key}" value="${e.hasta}" onchange="fsCambiar('${key}')" style="${inp}"/></div>
      </div>
      <div id="fsInfo_${key}" style="font-size:11.5px;color:var(--gray-500);align-self:center;">${fechas ? fsInfoTexto(key, fechas) : ''}</div>`;
}
function fsRender(key) {
  if (key === 'viajes') return renderViajesTable();
  if (key === 'retro') return renderRetroTable();
  if (key === 'maqlig') return renderMaqLigTable();
  if (key === 'nomina') return renderNominaTable();
  if (key === 'cajachica') return renderCajaChica();
  if (key === 'choferes') return renderChoferes();
  const mt = /^daily_(.+)_(\d+)$/.exec(key);
  if (mt) { const m = MODULES.find(x => x.id === mt[1]); if (m) renderModuleTable(m); }
}
function fsCambiar(key) {
  const e = fsEstado(key);
  const modo = document.getElementById('fsModo_' + key);
  if (modo) e.modo = modo.value;
  const d = document.getElementById('fsDesde_' + key), h = document.getElementById('fsHasta_' + key);
  e.desde = d ? d.value : ''; e.hasta = h ? h.value : '';
  const box = document.getElementById('fsCustom_' + key);
  if (box) box.style.display = e.modo === 'rango' ? 'flex' : 'none';
  fsRender(key);
}
// "Limpiar filtros": vuelve a mostrar todo el historial
function fsReset(key) {
  const e = fsEstado(key); e.modo = 'todo'; e.desde = ''; e.hasta = '';
  const s = document.getElementById('fsModo_' + key); if (s) s.value = 'todo';
  const c = document.getElementById('fsCustom_' + key); if (c) c.style.display = 'none';
}
// Al agregar un registro nuevo, si su fecha quedaría oculta por el filtro, se ajusta el filtro para que se vea
function fsAsegurarVisible(key, fecha, modoFallback) {
  const f = fecha || _fsIso(new Date());
  if (fsPasa(key, f)) return;
  const e = fsEstado(key); e.modo = modoFallback || 'semana'; e.desde = ''; e.hasta = '';
  const s = document.getElementById('fsModo_' + key); if (s) s.value = e.modo;
  const c = document.getElementById('fsCustom_' + key); if (c) c.style.display = 'none';
}
// Fecha ISO de un registro de nómina (los viejos solo guardaban "02 oct 2026")
function fsFechaNomina(r) {
  if (r.fechaISO) return r.fechaISO;
  const m = /(\d{1,2})\D+([a-záéíóú]{3,})\.?\s*(?:de\s*)?(\d{4})/i.exec(r.fecha || '');
  if (!m) return '';
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const mi = meses.indexOf(m[2].toLowerCase().slice(0, 3));
  if (mi < 0) return '';
  return m[3] + '-' + String(mi + 1).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
}

// Ajusta el ancho de los campos Cliente/Obra al texto escrito (y muestra el nombre completo al pasar el cursor)
let _medCanvas = null;
function ajustarAnchoCampo(el) {
  if (!el) return;
  if (!_medCanvas) _medCanvas = document.createElement('canvas');
  const ctx = _medCanvas.getContext('2d');
  const cs = getComputedStyle(el);
  ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
  const txt = el.value || el.placeholder || '';
  const w = Math.ceil(ctx.measureText(txt).width) + 18;
  el.style.maxWidth = 'none';
  el.style.width = Math.max(w, 110) + 'px';
  el.title = el.value || '';
}

function bloquearFilaDOM(tr) {
  if (!tr) return;
  tr.classList.add('fila-guardada');
  tr.querySelectorAll('input,select,textarea').forEach(el => { el.disabled = true; });
  tr.querySelectorAll('.btn-viaje-save,.btn-viaje-del').forEach(b => b.remove());
  const acc = tr.querySelector('.acciones-cell');
  if (acc && !acc.querySelector('.badge-guardado')) acc.insertAdjacentHTML('beforeend', BADGE_GUARDADO);
}
function bloquearFilasGuardadas(contenedor, prefijo, arr) {
  if (!contenedor) return;
  contenedor.querySelectorAll('tr[id^="' + prefijo + '"]').forEach(tr => {
    const idx = parseInt(tr.id.slice(prefijo.length), 10);
    if (regBloqueado(arr[idx])) bloquearFilaDOM(tr);
  });
}
function leerCamposFila(tr, obj, numericos) {
  if (!tr) return;
  tr.querySelectorAll('[data-field]').forEach(el => {
    const campo = el.dataset.field;
    if (el.type === 'checkbox') { obj[campo] = el.checked; return; }
    obj[campo] = (numericos || NUMERICOS_REG).includes(campo) ? (parseFloat(el.value) || 0) : el.value;
  });
}

// ── REINICIO A CERO (una sola vez por navegador) ────────
// Deja el dashboard limpio para empezar a capturar datos reales. Los datos que había guardados en este
// navegador NO se borran del todo: se apartan en un respaldo (STORAGE_KEY + '_respaldo_pre_cero').
const RESET_CERO_FLAG = 'flosan_reset_cero_v1';
function reinicioInicialACero() {
  try {
    if (localStorage.getItem(RESET_CERO_FLAG)) return;
    const viejo = localStorage.getItem(STORAGE_KEY);
    if (viejo) {
      localStorage.setItem(STORAGE_KEY + '_respaldo_pre_cero', viejo);
      localStorage.removeItem(STORAGE_KEY);
    }
    localStorage.setItem(RESET_CERO_FLAG, new Date().toISOString());
  } catch(e) { console.warn('No se pudo reiniciar a cero:', e); }
}

function cargarDatos() {
  reinicioInicialACero();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const payload = JSON.parse(raw);
    if (payload.modules) {
      payload.modules.forEach(saved => {
        const m = MODULES.find(x => x.id === saved.id);
        if (!m) return;
        // Actualizar solo vals y name, preservando isViajes/isRetro del código base
        saved.items.forEach(savedItem => {
          const baseItem = m.items.find(it =>
            it.name === savedItem.name ||
            (savedItem.isViajes && it.isViajes) ||
            (savedItem.isRetro && it.isRetro) ||
            (savedItem.isMaqLigera && it.isMaqLigera) ||
            (savedItem.isDieselEquipo && it.isDieselEquipo) ||
            (savedItem.isNominaNeto && it.isNominaNeto) ||
            (savedItem.isMantGeneralAuto && it.isMantGeneralAuto) ||
            (savedItem.isBodegaAuto && it.isBodegaAuto) ||
            (savedItem.isOficinaAuto && it.isOficinaAuto) ||
            (savedItem.isCajaChica && it.isCajaChica)
          );
          if (baseItem) {
            baseItem.vals = savedItem.vals;
            if (savedItem._guardado != null) baseItem._guardado = savedItem._guardado;
            if (savedItem.registros) baseItem.registros = savedItem.registros.map(r=>({...r}));
            if (savedItem.isCajaChica && savedItem.montoInicial != null) baseItem.montoInicial = parseFloat(savedItem.montoInicial) || 0;
            if (!baseItem.isViajes && !baseItem.isRetro && !baseItem.isMaqLigera && !baseItem.isDieselEquipo && !baseItem.isNominaNeto && !baseItem.isMantGeneralAuto && !baseItem.isBodegaAuto && !baseItem.isOficinaAuto && !baseItem.isCajaChica) baseItem.name = savedItem.name;
          } else if (!savedItem.isViajes && !savedItem.isRetro && !savedItem.isMaqLigera && !savedItem.isDieselEquipo && !savedItem.isNominaNeto && !savedItem.isMantGeneralAuto && !savedItem.isBodegaAuto && !savedItem.isOficinaAuto && !savedItem.isCajaChica) {
            // ítem extra agregado por el usuario
            m.items.push(savedItem);
          }
        });
      });
    }
    // Limpieza: el ítem manual "Diesel y Gasolina" quedó obsoleto (ahora el
    // gasto de diesel se calcula automáticamente desde el registro por equipo).
    const dieselMod = MODULES.find(x => x.id === 'diesel');
    if (dieselMod) dieselMod.items = dieselMod.items.filter(it => it.name !== 'Diesel y Gasolina');
    // Limpieza: "Sub-Renta Vactor" y "Pago RIVAS" quedaron obsoletos en Gastos Total
    // (ese módulo ahora solo muestra Diesel Equipos y Nómina, ambos automáticos).
    const gastosTotalMod = MODULES.find(x => x.id === 'pago_subrenta');
    if (gastosTotalMod) gastosTotalMod.items = gastosTotalMod.items.filter(it => it.name !== 'Sub-Renta Vactor' && it.name !== 'Pago RIVAS');
    if (payload.viajes) viajesData = payload.viajes;
    // Migración: en Viajes, Monto Gasto / Monto Final pasan a ser el PRECIO POR
    // UNIDAD; el total real (usado en todos los reportes) se calcula como
    // Cantidad × precio. Para no alterar los montos ya capturados, si un viaje
    // tiene Cantidad > 0 se convierte su Monto/Monto Final actual (que antes
    // era el total) al precio unitario equivalente (monto ÷ cantidad), y el
    // total resultante (cantidad × ese precio) queda igual que antes.
    viajesData.forEach(v => {
      if (v.precioUnitGasto == null) {
        const c = parseFloat(v.cantidad) || 0;
        v.precioUnitGasto = c > 0 ? (parseFloat(v.monto) || 0) / c : (parseFloat(v.monto) || 0);
        v.precioUnitFinal = c > 0 ? (parseFloat(v.montoFinal) || 0) / c : (parseFloat(v.montoFinal) || 0);
        v.monto = calcMontoPorCantidad(v.cantidad, v.precioUnitGasto);
        v.montoFinal = calcMontoPorCantidad(v.cantidad, v.precioUnitFinal);
      }
    });
    if (payload.retro) retroData = payload.retro;
    if (payload.maqLig) maqLigData = payload.maqLig;
    // Misma migración de precio unitario que en Viajes, ahora también para
    // Maquinaria Pesada y Maquinaria Ligera.
    [retroData, maqLigData].forEach(arr => {
      arr.forEach(v => {
        if (v.precioUnitGasto == null) {
          const c = parseFloat(v.cantidad) || 0;
          v.precioUnitGasto = c > 0 ? (parseFloat(v.monto) || 0) / c : (parseFloat(v.monto) || 0);
          v.precioUnitFinal = c > 0 ? (parseFloat(v.montoFinal) || 0) / c : (parseFloat(v.montoFinal) || 0);
          v.monto = calcMontoPorCantidad(v.cantidad, v.precioUnitGasto);
          v.montoFinal = calcMontoPorCantidad(v.cantidad, v.precioUnitFinal);
        }
      });
    });
    if (payload.dieselEq) dieselEqData = payload.dieselEq;
    if (payload.dieselJuanCargas) dieselJuanCargas = payload.dieselJuanCargas;
    if (payload.dieselJuanSalidas) dieselJuanSalidas = payload.dieselJuanSalidas;
    if (payload.dieselJuanLimiteSemanal != null) dieselJuanLimiteSemanal = parseFloat(payload.dieselJuanLimiteSemanal) || 0;
    if (payload.dieselJuanUmbralAlerta != null) dieselJuanUmbralAlerta = parseFloat(payload.dieselJuanUmbralAlerta) || 0;
    if (payload.nominaCostoHoraExtra != null) nominaCostoHoraExtra = parseFloat(payload.nominaCostoHoraExtra) || 0;
    if (payload.nominaEmpleadoIds) nominaEmpleadoIds = payload.nominaEmpleadoIds;
    if (payload.nominaEmpleadoIdSeq != null) nominaEmpleadoIdSeq = payload.nominaEmpleadoIdSeq;
    if (payload.nominaReg) {
      // Compatibilidad con registros guardados antes de agregar salario base,
      // caja de ahorro, horas extra, viáticos y otros.
      nominaData = payload.nominaReg.map(r => ({
        salarioBase: r.salarioBase != null ? r.salarioBase : (r.monto || 0),
        tieneHorasExtra: r.tieneHorasExtra || false,
        horasExtra: r.horasExtra || 0,
        tieneViaticos: r.tieneViaticos || false,
        viaticos: r.viaticos || 0,
        tieneOtros: r.tieneOtros || false,
        otros: r.otros || 0,
        tieneAhorro: r.tieneAhorro || false,
        descuentoAhorro: r.descuentoAhorro || 0,
        tieneDescuento: r.tieneDescuento || false,
        descuento: r.descuento || 0,
        ...r
      }));
    }
    // Migración: asegurar que cada persona tenga un número de empleado asignado,
    // incluso si el registro se guardó antes de que existiera esta función.
    nominaData.forEach(r => {
      if (r.empleadoId == null) r.empleadoId = obtenerNominaEmpleadoId(r.persona);
      else if (nominaEmpleadoIds[(r.persona||'').trim().toLowerCase()] == null) {
        nominaEmpleadoIds[(r.persona||'').trim().toLowerCase()] = r.empleadoId;
        if (r.empleadoId >= nominaEmpleadoIdSeq) nominaEmpleadoIdSeq = r.empleadoId + 1;
      }
    });
  } catch(e) { console.warn('No se pudo cargar:', e); }
}

  const hoy = new Date().toISOString().split('T')[0];
  fsAsegurarVisible('retro', hoy);
  retroData.unshift({ _guardado: false, fecha: hoy, cliente: '', chofer: '', tipo: 'retro1', tipoOtro: '', obra: '', renta: 'hora', rentaExtra: '', cantidad: 0, accesorioTipo: '', accesorioOtro: '', tiempoExtra: 0, precioUnitGasto: 0, precioUnitFinal: 0, monto: 0, montoFinal: 0, iva: false, ivaFinal: false });
  guardarDatos();
  renderRetroTable();
}

function eliminarRetro(i) {
  retroData.splice(i, 1);
  recalcRetroEnIngresos();
  guardarDatos();
  renderRetroTable();
  if (document.getElementById('retroClienteDashSection').style.display !== 'none') renderRetroClienteDash();
  if (activeTab === 'balance_general') renderBalanceGeneralCliente();
}

function confirmarEliminarRetro(i) {
  const cliente = retroData[i].cliente || 'sin nombre';
  if (confirm(`¿Eliminar el registro del cliente "${cliente}"?\nEsta acción no se puede deshacer.`)) eliminarRetro(i);
}

function updateRetro(i, campo, val) {
  if (regBloqueado(retroData[i])) return;
  if (campo === 'iva' || campo === 'ivaFinal') {
    retroData[i][campo] = !!val;
  } else {
    const camposNumericos = ['monto','montoFinal','cantidad','tiempoExtra','precioUnitGasto','precioUnitFinal'];
    retroData[i][campo] = camposNumericos.includes(campo) ? (parseFloat(val)||0) : val;
  }
  if (campo === 'cantidad' || campo === 'precioUnitGasto' || campo === 'precioUnitFinal') {
    recalcMontosViaje(retroData[i]);
  }
  if (campo==='montoFinal' || campo==='precioUnitFinal' || campo==='cantidad' || campo==='fecha' || campo==='iva' || campo==='ivaFinal') recalcRetroEnIngresos();
  guardarDatos();
  renderRetroTable();
}

function guardarRetroFila(i) {
  if (!retroData[i] || regBloqueado(retroData[i])) return;
  const row = document.getElementById('retro-row-' + i);
  if (row) {
    leerCamposFila(row, retroData[i], NUMERICOS_REG);
    recalcMontosViaje(retroData[i]);
  }
  retroData[i]._guardado = true;
  recalcRetroEnIngresos();
  guardarDatos();
  renderRetroTable();
  if (document.getElementById('retroClienteDashSection').style.display !== 'none') renderRetroClienteDash();
  if (activeTab === 'balance_general') renderBalanceGeneralCliente();
}

let retroClienteDashVisible = false;
function toggleRetroClienteDash() {
  retroClienteDashVisible = !retroClienteDashVisible;
  const sec = document.getElementById('retroClienteDashSection');
  if (retroClienteDashVisible) {
    sec.style.display = 'block';

}

function renderRetroClienteDash() {
  const content = document.getElementById('retroClienteDashContent');
  const countEl = document.getElementById('retroClienteCount');
  if (!content) return;

  const enRango = (r) => {
    if (retroBalDesde && r.fecha < retroBalDesde) return false;
    if (retroBalHasta && r.fecha > retroBalHasta) return false;
    return true;
  };

  const grupos = {};
  retroData.filter(enRango).forEach(r => {
    const key = (r.cliente || '').trim();
    if (!key) return;
    const norm = key.toLowerCase();
    if (!grupos[norm]) grupos[norm] = { nombre: key, registros: [] };
    grupos[norm].registros.push(r);
  });

  const clientes = Object.values(grupos);
  const rangoTxt = (retroBalDesde || retroBalHasta) ? ` · ${retroBalDesde||'inicio'} a ${retroBalHasta||'hoy'}` : '';
  if (countEl) countEl.textContent = `· ${clientes.length} cliente${clientes.length!==1?'s':''} encontrado${clientes.length!==1?'s':''}${rangoTxt}`;

  if (clientes.length === 0) {
    content.innerHTML = `<div class="no-clientes"><div style="font-size:32px;margin-bottom:10px">👤</div><div>No hay clientes registrados en ese rango de fechas.</div></div>`;
    return;
  }

  const COLORES = ['#7c3aed','#2563eb','#d97706','#dc2626','#0891b2','#16a34a','#db2777','#64748b'];

  content.innerHTML = clientes.map((cli, ci) => {
    const color = COLORES[ci % COLORES.length];
    const totalInicial = cli.registros.reduce((s,r) => s + (r.monto||0), 0);
    const totalIva = cli.registros.reduce((s,r) => s + (r.iva ? (parseFloat(r.monto)||0)*IVA_RATE_VIAJES : 0), 0);
    const regsConIva = cli.registros.filter(r => r.iva).length;
    const tieneIva = totalIva > 0;
    const totalFinal = cli.registros.reduce((s,r) => s + montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal), 0);
    const utilidad = totalFinal - totalInicial;
    const margen = totalFinal > 0 ? Math.round(utilidad / totalFinal * 100) : 0;

    const porTipo = {};
    cli.registros.forEach(r => {
      if (!porTipo[r.tipo]) porTipo[r.tipo] = { regs:0, monto:0, montoFinal:0, iva:0 };
      porTipo[r.tipo].regs++;
      porTipo[r.tipo].monto += r.monto||0;
      porTipo[r.tipo].montoFinal += montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal);
      porTipo[r.tipo].iva += r.iva ? (parseFloat(r.monto)||0)*IVA_RATE_VIAJES : 0;

      <table class="cliente-table">
        <thead><tr><th>Tipo</th><th style="text-align:right">Registros</th><th style="text-align:right">Monto Inicial</th>${tieneIva?'<th style="text-align:right">IVA</th>':''}<th style="text-align:right">Monto Final</th><th style="text-align:right">Utilidad</th></tr></thead>
        <tbody>

function imprimirRetroCliente(nombreCliente) {
  const key = nombreCliente.trim().toLowerCase();
  const registros = retroData.filter(r => (r.cliente||'').trim().toLowerCase() === key);
  if (!registros.length) { alert('No hay registros para este cliente.'); return; }

  const totalInicial = registros.reduce((s,r) => s + (r.monto||0), 0);
  const totalIva = registros.reduce((s,r) => s + (r.iva ? (parseFloat(r.monto)||0)*IVA_RATE_VIAJES : 0), 0);
  const regsConIva = registros.filter(r => r.iva).length;
  const tieneIva = totalIva > 0;
  const totalFinal = registros.reduce((s,r) => s + montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal), 0);
  const utilidad = totalFinal - totalInicial;
  const margen = totalFinal > 0 ? Math.round(utilidad / totalFinal * 100) : 0;
  const hoy = new Date().toLocaleDateString('es-MX', { day:'2-digit', month:'long', year:'numeric' });

  const porTipo = {};
  registros.forEach(r => {
    if (!porTipo[r.tipo]) porTipo[r.tipo] = { regs:0, monto:0, montoFinal:0, iva:0 };
    porTipo[r.tipo].regs++;
    porTipo[r.tipo].monto += r.monto||0;
    porTipo[r.tipo].montoFinal += montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal);
    porTipo[r.tipo].iva += r.iva ? (parseFloat(r.monto)||0)*IVA_RATE_VIAJES : 0;
  });

  const tiposRows = Object.entries(porTipo).map(([tipo, d]) => `
    <tr>

function recalcMaqLigEnIngresos() {
  const modRentas = MODULES.find(m => m.id === 'ing_rentas');
  if (!modRentas) return;
  let itemML = modRentas.items.find(it => it.isMaqLigera);
  if (!itemML) return;
  const nuevos = new Array(12).fill(0);
  maqLigData.forEach(r => {
    const mes = new Date(r.fecha + 'T12:00:00').getMonth();
    nuevos[mes] += montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal);
  });
  itemML.vals = nuevos;
  renderModuleTable(modRentas);
  refreshDashboard();
  guardarDatos();
}

function limpiarFiltrosMaqLig() {

function agregarMaqLig() {
  const hoy = new Date().toISOString().split('T')[0];
  fsAsegurarVisible('maqlig', hoy);
  maqLigData.unshift({ _guardado: false, fecha: hoy, cliente: '', obra: '', chofer: '', tipo: 'bailarinas', renta: 'dia', rentaExtra: '', cantidad: 0, precioUnitGasto: 0, precioUnitFinal: 0, monto: 0, montoFinal: 0, iva: false, ivaFinal: false });
  guardarDatos();
  renderMaqLigTable();
}

function eliminarMaqLig(i) {
  maqLigData.splice(i, 1);
  recalcMaqLigEnIngresos();
  guardarDatos();
  renderMaqLigTable();
  if (document.getElementById('maqLigClienteDashSection').style.display !== 'none') renderMaqLigClienteDash();
  if (activeTab === 'balance_general') renderBalanceGeneralCliente();
}

function confirmarEliminarMaqLig(i) {
  const cliente = maqLigData[i].cliente || 'sin nombre';
  if (confirm(`¿Eliminar el registro del cliente "${cliente}"?\nEsta acción no se puede deshacer.`)) eliminarMaqLig(i);
}

function updateMaqLig(i, campo, val) {
  if (regBloqueado(maqLigData[i])) return;
  if (campo === 'iva' || campo === 'ivaFinal') {
    maqLigData[i][campo] = !!val;
  } else {
    const camposNumericos = ['monto','montoFinal','cantidad','tiempoExtra','precioUnitGasto','precioUnitFinal'];
    maqLigData[i][campo] = camposNumericos.includes(campo) ? (parseFloat(val)||0) : val;
  }
  if (campo === 'cantidad' || campo === 'precioUnitGasto' || campo === 'precioUnitFinal') {
    recalcMontosViaje(maqLigData[i]);
  }
  if (campo==='montoFinal' || campo==='precioUnitFinal' || campo==='cantidad' || campo==='fecha' || campo==='iva' || campo==='ivaFinal') recalcMaqLigEnIngresos();
  guardarDatos();
  renderMaqLigTable();
}

function guardarMaqLigFila(i) {
  if (!maqLigData[i] || regBloqueado(maqLigData[i])) return;
  const row = document.getElementById('maql-row-' + i);
  if (row) {
    leerCamposFila(row, maqLigData[i], NUMERICOS_REG);
    recalcMontosViaje(maqLigData[i]);
  }
  maqLigData[i]._guardado = true;
  recalcMaqLigEnIngresos();
  guardarDatos();
  renderMaqLigTable();
  if (document.getElementById('maqLigClienteDashSection').style.display !== 'none') renderMaqLigClienteDash();
  if (activeTab === 'balance_general') renderBalanceGeneralCliente();
}

        fsPasa('maqlig', r.fecha)) acc.push(i);

  }, []);

  if (countEl) countEl.textContent = `${filtered.length} registro${filtered.length!==1?'s':''}`;

  const totalInicial = maqLigData.reduce((s,r)=>s+(r.monto||0),0);

  if (filtered.length === 0) { tbody.innerHTML=''; if(empty) empty.style.display='block'; return; }
  if (empty) empty.style.display = 'none';

  tbody.innerHTML = filtered.map((r, fi) => {
    const ri = realIndices[fi];
    const tc = MAQL_COLORS[r.tipo] || {bg:'#fef3c7',text:'#92400e'};

      <td><input class="viaje-input" type="text" data-field="obra" value="${r.obra||''}" placeholder="Nombre de la obra…" onchange="updateMaqLig(${ri},'obra',this.value)"/></td>
      <td><input class="viaje-input" type="text" data-field="chofer" value="${r.chofer||''}" placeholder="Nombre del chofer…" style="max-width:110px;" onchange="updateMaqLig(${ri},'chofer',this.value)"/></td>
      <td>
        <select class="viaje-select-inline" data-field="tipo" onchange="updateMaqLig(${ri},'tipo',this.value)" style="color:#000;background:#fff;border:1px solid #94a3b8">
          ${MAQL_TIPOS.map(t=>`<option value="${t}" ${r.tipo===t?'selected':''}>${MAQL_LABELS[t]}</option>`).join('')}
        </select>
      </td>
      <td>
        <select class="viaje-select-inline" data-field="renta" onchange="updateMaqLig(${ri},'renta',this.value)">
          ${MAQL_RENTAS.map(t=>`<option value="${t}" ${r.renta===t?'selected':''}>${MAQL_RENTA_LABELS[t]}</option>`).join('')}
        </select>
        ${r.renta==='extra' ? `<input class="viaje-input" type="text" data-field="rentaExtra" value="${r.rentaExtra||''}" placeholder="Especificar…" style="margin-top:4px;max-width:100px;display:block;" onchange="updateMaqLig(${ri},'rentaExtra',this.value)"/>` : ''}
      </td>
      <td style="text-align:right">
        <input class="editable" type="number" data-field="cantidad" value="${r.cantidad||''}" placeholder="0" style="max-width:70px;" onchange="updateMaqLig(${ri},'cantidad',this.value)"/>
      </td>
      <td style="text-align:right">
        <input class="editable" type="number" data-field="precioUnitGasto" value="${r.precioUnitGasto||''}" placeholder="0" style="max-width:90px;color:#dc2626;" onchange="updateMaqLig(${ri},'precioUnitGasto',this.value)"/>
        <div style="font-size:9.5px;color:#64748b;margin-top:2px;">${r.cantidad>0?`× ${r.cantidad} = `:'= '}<strong style="color:#dc2626">${fmt(r.monto||0)}</strong></div>
        ${r.iva ? `<div style="font-size:9.5px;color:#dc2626;margin-top:2px;">+ IVA ${fmt((parseFloat(r.monto)||0)*IVA_RATE_VIAJES)} = ${fmt((parseFloat(r.monto)||0)*(1+IVA_RATE_VIAJES))}</div>` : ''}
      </td>
      <td style="text-align:center">
        <input type="checkbox" data-field="iva" ${r.iva?'checked':''} title="Sumar IVA (16%) al Monto Gasto"
          onchange="updateMaqLig(${ri},'iva',this.checked)"
          style="width:15px;height:15px;cursor:pointer;accent-color:#d97706;"/>
      </td>
      <td style="text-align:right">

        <div style="font-size:9.5px;color:#64748b;margin-top:2px;">${r.cantidad>0?`× ${r.cantidad} = `:'= '}<strong style="color:#d97706">${fmt(r.montoFinal||0)}</strong></div>
        ${r.ivaFinal ? `<div style="font-size:9.5px;color:#d97706;margin-top:2px;">+ IVA ${fmt((parseFloat(r.montoFinal)||0)*IVA_RATE_VIAJES)} = ${fmt((parseFloat(r.montoFinal)||0)*(1+IVA_RATE_VIAJES))}</div>` : ''}
      </td>
      <td style="text-align:center">
        <input type="checkbox" data-field="ivaFinal" ${r.ivaFinal?'checked':''} title="Sumar IVA (16%) al Monto Final"
          onchange="updateMaqLig(${ri},'ivaFinal',this.checked)"

      </td>

let maqLigClienteDashVisible = false;
function toggleMaqLigClienteDash() {
  maqLigClienteDashVisible = !maqLigClienteDashVisible;
  const sec = document.getElementById('maqLigClienteDashSection');
  if (maqLigClienteDashVisible) {
    sec.style.display = 'block';
    renderMaqLigClienteDash();
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else { sec.style.display = 'none'; }
}

function filtrarMaqLigBalance() {
  maqLigBalDesde = document.getElementById('maqLigBalDesde').value;
  maqLigBalHasta = document.getElementById('maqLigBalHasta').value;
  renderMaqLigClienteDash();
}
function limpiarMaqLigBalance() {
  maqLigBalDesde = ''; maqLigBalHasta = '';
  document.getElementById('maqLigBalDesde').value = '';
  document.getElementById('maqLigBalHasta').value = '';
  renderMaqLigClienteDash();
}

function renderMaqLigClienteDash() {
  const content = document.getElementById('maqLigClienteDashContent');
  const countEl = document.getElementById('maqLigClienteCount');
  if (!content) return;

  // Filtrar por rango de fechas (si se definió)
  const enRango = (r) => {
    if (maqLigBalDesde && r.fecha < maqLigBalDesde) return false;
    if (maqLigBalHasta && r.fecha > maqLigBalHasta) return false;
    return true;
  };

  const grupos = {};
  maqLigData.filter(enRango).forEach(r => {
    const key = (r.cliente || '').trim();
    if (!key) return;
    const norm = key.toLowerCase();
    if (!grupos[norm]) grupos[norm] = { nombre: key, registros: [] };
    grupos[norm].registros.push(r);
  });

  const clientes = Object.values(grupos);
  const rangoTxt = (maqLigBalDesde || maqLigBalHasta) ? ` · ${maqLigBalDesde||'inicio'} a ${maqLigBalHasta||'hoy'}` : '';
  if (countEl) countEl.textContent = `· ${clientes.length} cliente${clientes.length!==1?'s':''} encontrado${clientes.length!==1?'s':''}${rangoTxt}`;

  if (clientes.length === 0) {
    content.innerHTML = `<div class="no-clientes"><div style="font-size:32px;margin-bottom:10px">👤</div><div>No hay clientes registrados en ese rango de fechas.</div></div>`;
    return;
  }

  const COLORES = ['#d97706','#2563eb','#7c3aed','#dc2626','#0891b2','#16a34a','#db2777','#64748b'];

  content.innerHTML = clientes.map((cli, ci) => {
    const color = COLORES[ci % COLORES.length];
    // Balance general: se suman TODOS los registros del cliente en uno solo (ya no por tipo/registro individual)
    const totalInicial = cli.registros.reduce((s,r)=>s+(r.monto||0),0);
    const totalIva = cli.registros.reduce((s,r)=>s+(r.iva ? (parseFloat(r.monto)||0)*IVA_RATE_VIAJES : 0),0);
    const regsConIva = cli.registros.filter(r=>r.iva).length;
    const tieneIva = totalIva > 0;
    const totalFinal = cli.registros.reduce((s,r)=>s+montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal),0);
    const totalCantidad = cli.registros.reduce((s,r)=>s+(r.cantidad||0),0);
    const utilidad = totalFinal - totalInicial;
    const margen = totalFinal > 0 ? Math.round(utilidad/totalFinal*100) : 0;

    // Aviso de datos incompletos: si algún registro no tiene tipo, renta o cantidad capturados
    const sinTipo = cli.registros.filter(r => !r.tipo).length;
    const sinRenta = cli.registros.filter(r => !r.renta || !r.renta.trim()).length;
    const sinCantidad = cli.registros.filter(r => !r.cantidad).length;
    const avisos = [];
    if (sinTipo) avisos.push(`${sinTipo} registro${sinTipo!==1?'s':''} sin Tipo especificado`);
    if (sinRenta) avisos.push(`${sinRenta} registro${sinRenta!==1?'s':''} sin Renta especificada`);
    if (sinCantidad) avisos.push(`${sinCantidad} registro${sinCantidad!==1?'s':''} sin Cantidad especificada`);
    const avisosHtml = avisos.length ? `<div style="margin-top:10px;font-size:11px;color:#92400e;background:#fef3c7;border-radius:var(--radius-sm);padding:8px 10px;">⚠ ${avisos.join(' · ')} — no afecta la suma de montos, solo indica datos incompletos en esos registros.</div>` : '';

    return `<div class="cliente-card">
      <div class="cliente-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:36px;height:36px;border-radius:50%;background:${color}22;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:${color}">${cli.nombre.charAt(0).toUpperCase()}</div>
          <div><div class="cliente-nombre">${cli.nombre}</div><div style="font-size:11px;color:var(--gray-400)">${cli.registros.length} registro${cli.registros.length!==1?'s':''}</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-size:12px;color:${margen>=0?'#16a34a':'#dc2626'};font-weight:600;background:${margen>=0?'#dcfce7':'#fee2e2'};padding:4px 12px;border-radius:20px;">Margen ${margen}%</div>
          <button class="btn-print-cliente" onclick="imprimirMaqLigCliente('${cli.nombre.replace(/'/g,"\\'")}')">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" style="width:12px;height:12px"><rect x="2" y="5" width="10" height="7" rx="1"/><path d="M4 5V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><rect x="4" y="8" width="6" height="1.5" rx="0.5" fill="currentColor" stroke="none"/></svg>
            Imprimir
          </button>
        </div>
      </div>
      <div class="cliente-metricas">
        <div class="cli-metric"><div class="cli-metric-label">Total Registros</div><div class="cli-metric-val" style="color:${color}">${cli.registros.length}</div></div>
        <div class="cli-metric"><div class="cli-metric-label">Cantidad Total</div><div class="cli-metric-val" style="color:${color}">${totalCantidad>0?totalCantidad:'—'}</div></div>
        <div class="cli-metric"><div class="cli-metric-label">Monto Inicial</div><div class="cli-metric-val" style="color:#dc2626">${totalInicial>0?fmt(totalInicial):'—'}</div></div>
        <div class="cli-metric"><div class="cli-metric-label">IVA (16%)</div><div class="cli-metric-val" style="color:#d97706">${totalIva>0?fmt(totalIva):'—'}</div></div>
        <div class="cli-metric"><div class="cli-metric-label">Monto Final (Ingreso)</div><div class="cli-metric-val" style="color:#16a34a">${totalFinal>0?fmt(totalFinal):'—'}</div></div>
        <div class="cli-metric"><div class="cli-metric-label">Balance / Utilidad Neta</div><div class="cli-metric-val" style="color:${utilidad>=0?'#16a34a':'#dc2626'}">${fmt(utilidad)}</div></div>
      </div>
      ${tieneIva ? `<div style="margin-top:8px;font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:8px 12px;">🧾 El Monto Final incluye IVA (16%) en ${regsConIva} registro${regsConIva!==1?'s':''} con la casilla de IVA marcada, por un total de <strong>${fmt(totalIva)}</strong> de IVA.</div>` : ''}
      ${avisosHtml}
    </div>`;
  }).join('');
}

function imprimirMaqLigCliente(nombreCliente) {
  const key = nombreCliente.trim().toLowerCase();
  const registros = maqLigData.filter(r => (r.cliente||'').trim().toLowerCase() === key);
  if (!registros.length) { alert('No hay registros para este cliente.'); return; }

  const totalInicial = registros.reduce((s,r)=>s+(r.monto||0),0);
  const totalIva = registros.reduce((s,r)=>s+(r.iva ? (parseFloat(r.monto)||0)*IVA_RATE_VIAJES : 0),0);
  const regsConIva = registros.filter(r=>r.iva).length;
  const tieneIva = totalIva > 0;
  const totalFinal = registros.reduce((s,r)=>s+montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal),0);
  const utilidad = totalFinal - totalInicial;
  const margen = totalFinal > 0 ? Math.round(utilidad/totalFinal*100) : 0;
  const hoy = new Date().toLocaleDateString('es-MX', {day:'2-digit',month:'long',year:'numeric'});

  const porTipo = {};
  registros.forEach(r => {
    if (!porTipo[r.tipo]) porTipo[r.tipo] = {regs:0,monto:0,montoFinal:0,iva:0};
    porTipo[r.tipo].regs++;
    porTipo[r.tipo].monto += r.monto||0;
    porTipo[r.tipo].montoFinal += montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal);
    porTipo[r.tipo].iva += r.iva ? (parseFloat(r.monto)||0)*IVA_RATE_VIAJES : 0;
  });

  const tiposRows = Object.entries(porTipo).map(([tipo,d])=>`
    <tr><td style="padding:8px 10px;border-bottom:1px solid #f1f5f9">${MAQL_LABELS[tipo]||tipo}</td>
    <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right">${d.regs}</td>
    <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right;color:#dc2626">${d.monto>0?fmt(d.monto):'—'}</td>
    ${tieneIva ? `<td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right;color:#d97706">${d.iva>0?fmt(d.iva):'—'}</td>` : ''}
    <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right;color:#16a34a;font-weight:600">${d.montoFinal>0?fmt(d.montoFinal):'—'}</td>
    <td style="padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:right;color:${(d.montoFinal-d.monto)>=0?'#16a34a':'#dc2626'}">${fmt(d.montoFinal-d.monto)}</td></tr>`).join('');

  const regsRows = registros.map((r,i)=>{
    const tc=MAQL_COLORS[r.tipo]||{bg:'#fef3c7',text:'#d97706'};
    const rc=MAQL_RENTA_COLORS[r.renta]||{bg:'#fef3c7',text:'#92400e'};
    return `<tr style="background:${i%2===0?'#fff':'#f8fafc'}">
      <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px;color:#94a3b8">${i+1}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px">${r.fecha||'—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px"><span style="background:${tc.bg};color:${tc.text};padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600">${MAQL_LABELS[r.tipo]||r.tipo}</span></td>
      <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px"><span style="background:${rc.bg};color:${rc.text};padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600">${r.renta==='extra' && (r.rentaExtra||'').trim() ? r.rentaExtra.trim() : (MAQL_RENTA_LABELS[r.renta]||r.renta)}</span></td>
      <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px;text-align:right;color:#dc2626">${r.monto>0?fmt(r.monto):'—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px;text-align:center">${r.iva?'Sí':'—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px;text-align:right;color:#d97706;font-weight:600">${fmt(montoConIva(r.montoFinal, r.montoFinal, r.ivaFinal))}</td>
    </tr>`;}).join('');

  const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>FLOSAN — Maq. Ligera — ${nombreCliente}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<div class="no-print"><button class="btn" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button><button class="btn btn-sec" onclick="window.close()">✕ Cerrar</button></div>

  <div><div class="brand"><img src="${LOGO_FLOSAN}" alt="FLOSAN Maquinaria" style="height:70px;width:auto;vertical-align:middle;margin-right:12px;border-radius:6px"> <span style="font-size:13px;font-weight:400;color:#64748b">· Maq. Ligera 2026</span></div><div style="font-size:11px;color:#64748b;margin-top:4px">Reporte por Cliente</div></div>
  <div style="text-align:right"><div style="font-size:11px;color:#64748b">Generado el</div><div style="font-weight:600;font-size:12px">${hoy}</div></div>

];

function filtrarBalanceGeneral() {

function limpiarBalanceGeneral() {

  document.getElementById('balGenDesdeInput').value = '';
  document.getElementById('balGenHastaInput').value = '';
